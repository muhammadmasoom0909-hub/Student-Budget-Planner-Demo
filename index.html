    function recentActivityMarkup(limit=5){const list=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);if(!list.length)return emptyInline('Your recent activity will appear here.','quick','Add a transaction','receipt');return `<div class="list-limit">${list.map(t=>{const positive=isActualIncome(t)||isContribution(t),label=t.name||txLabel(t.type),categoryLabel=t.categoryId?category(t.categoryId).name:txLabel(t.type),amount=money(t.amount),sign=positive?'+':'−',tone=positive?'positive':'negative',ico=t.type==='income'?'arrowUp':t.type==='savingsContribution'?'target':t.categoryId?category(t.categoryId).icon:'receipt';return `<div class="row"><div class="rowicon">${icon(ico)}</div><div><div class="rowtitle">${esc(label)}</div><div class="rowmeta">${esc(categoryLabel)} · ${dateFmt(t.date,true)}</div></div><div class="rowmoney ${tone} num">${sign}${amount}</div></div>`;}).join('')}</div>`;}
    function enhanceDashboardRecent(){if(page!=='dashboard')return;const card=[...document.querySelectorAll('.dashboard-grid > .col > .card')].find(x=>x.querySelector('h2')?.textContent.trim()==='Recent expenses');if(!card)return;const title=card.querySelector('h2');if(title)title.textContent='Recent activity';const link=card.querySelector('.cardhead .linkbtn');if(link){link.dataset.tab='transactions';link.classList.add('dashboard-recent-link');link.innerHTML='View all '+icon('chevronRight');}const existing=card.querySelector('.list-limit');if(existing)existing.outerHTML=recentActivityMarkup(5);else{const empty=card.querySelector('.empty');if(empty)empty.outerHTML=recentActivityMarkup(5);}}
    function enhanceNavigationBrand(){document.querySelectorAll('.sidebar .brandmark,.mobile-brand .brandmark').forEach(mark=>{mark.innerHTML=icon('budget');});const settingsIcon=document.querySelector('.sidebar .sidefoot .navitem svg');if(settingsIcon)settingsIcon.innerHTML=ICONS.sun;}
    function enhanceTopbar(){const crumb=document.querySelector('.topbar .crumb');if(crumb)crumb.innerHTML='<strong>'+esc(pageTitle())+'</strong>';}
    function enhanceBudgetPage(){if(page!=='budget')return;const card=[...document.querySelectorAll('.budget-stack > .card')].find(x=>x.querySelector('h2')?.textContent.trim()==='Upcoming commitments');if(card)card.remove();document.querySelector('.budget-mix-note')?.remove();}
    function enhanceBudgetControls(){if(page!=='budget')return;document.querySelectorAll('.budget-edit').forEach(btn=>{btn.classList.add('budget-edit-label');btn.innerHTML=icon('edit')+' Edit';btn.setAttribute('aria-label','Edit category budget');});const add=document.querySelector('[data-action="new-allocation"]');if(add){add.classList.add('budget-add-category');add.innerHTML=icon('plus')+' Add to budget';add.setAttribute('aria-label','Add existing category to budget');}}
    function recentExpensesMarkup(m,limit=5){const list=expensesFor(m).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,limit);if(!list.length)return emptyInline('Your daily spending will appear here.','quick','Add an expense','receipt');return `<div class="list-limit">${list.map(t=>`<div class="row"><div class="rowicon">${icon(category(t.categoryId).icon)}</div><div><div class="rowtitle">${esc(t.name||category(t.categoryId).name)}</div><div class="rowmeta">${esc(category(t.categoryId).name)} · ${dateFmt(t.date,true)}</div></div><div class="rowmoney negative num">−${money(t.amount)}</div></div>`).join('')}</div>`;}
    function emptyInline(text,action,label,ico='info'){return `<div class="empty" style="padding:28px 10px"><div class="empty-icon" style="width:50px;height:50px;border-radius:15px;margin-bottom:12px">${icon(ico)}</div><p>${esc(text)}</p><button class="btn soft small" data-action="${action}">${esc(label)}</button></div>`;}
    function goalsMarkup(limit=2){const goals=[...state.savingsGoals,...state.sinkingFunds].filter(x=>x.status!=='archived').slice(0,limit);if(!goals.length)return emptyInline('Create a savings goal for something that matters to you.','new-goal','Create goal','target');return `<div class="goal-stack">${goals.map(g=>{const savedC=goalSaved(g),pct=g.targetCents?clamp(savedC/g.targetCents*100,0,100):0;return `<article class="goal-card"><div class="goal-top"><div class="goal-icon">${icon(g.kind==='fund'?'wallet':'target')}</div><span class="pill ${pct>=100?'sage':'gold'}">${g.kind==='fund'?'Sinking fund':'Goal'}</span></div><h3>${esc(g.name)}</h3><div class="goal-amount num">${money(savedC)} <span class="muted" style="font-size:.72rem;font-weight:500">of ${money(g.targetCents)}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-meta"><span>${Math.round(pct)}% reached</span><span>${g.targetDate?dateFmt(g.targetDate,true):'No target date'}</span></div></article>`;}).join('')}</div>`;}
    function semesterSnapshotMarkup(t){const planned=termPlanned(t),actual=termActual(t),remaining=planned-actual;return `<div class="semester-snapshot"><div class="semester-cost"><span class="eyebrow">Planned education costs</span><strong class="num">${money(planned)}</strong></div><div class="progress gold"><span style="width:${planned?clamp(actual/planned*100,0,100):0}%"></span></div><div class="small-facts"><div><span>Actual paid</span><strong class="num">${money(actual)}</strong></div><div><span>${remaining>=0?'Remaining':'Over plan'}</span><strong class="num ${remaining>=0?'positive':'negative'}">${money(Math.abs(remaining))}</strong></div><div><span>Progress</span><strong>${termProgress(t)}%</strong></div></div></div>`;}
    function termProgress(t){const start=parseDate(t.startDate),end=parseDate(t.endDate),total=end-start;if(!Number.isFinite(total)||total<=0)return today()>=t.endDate?100:0;const elapsed=parseDate(today())-start;return clamp(Math.round(elapsed/total*100),0,100);}
    function comingItems(){const items=[];for(const o of state.billOccurrences.filter(x=>x.status!=='paid'&&x.status!=='cancelled'))items.push({date:o.dueDate,label:o.name||state.billDefinitions.find(b=>b.id===o.definitionId)?.name||'Bill',type:'Bill',kind:'bill',id:o.id,overdue:o.dueDate<today()});for(const o of state.subscriptionCycles.filter(x=>x.status!=='paid'&&x.status!=='cancelled'))items.push({date:o.billingDate,label:o.name||state.subscriptionDefinitions.find(b=>b.id===o.definitionId)?.name||'Subscription',type:o.isTrial?'Trial ending':'Renewal',kind:'subscription',id:o.id,overdue:false});for(const c of state.educationCostItems.filter(x=>x.dueDate&&itemPaid(x)<x.plannedCents))items.push({date:c.dueDate,label:c.name,type:'Education cost',kind:'education',id:c.id,overdue:c.dueDate<today()});return items.sort((a,b)=>a.date.localeCompare(b.date));}
    function comingUpMarkup(limit=3){const list=comingItems().slice(0,limit);if(!list.length)return emptyInline('No bills, renewals or education dates are coming up.','new-bill','Add a bill','receipt');return list.map(x=>`<div class="row"><div class="rowicon">${icon(x.kind==='education'?'graduation':x.kind==='subscription'?'repeat':'receipt')}</div><div><div class="rowtitle">${esc(x.label)}</div><div class="rowmeta">${esc(x.type)} · ${x.date<today()?'Overdue':x.date===today()?'Due today':dateFmt(x.date,true)}</div></div><span class="pill ${x.overdue?'coral':x.date===today()?'amber':'gold'}">${x.overdue?'Overdue':x.date===today()?'Today':dateFmt(x.date,true)}</span></div>`).join('');}

    function budgetPage(){const b=budget(selectedMonth),a=allocations(selectedMonth),planned=b.plannedCents||a.reduce((s,x)=>s+x.plannedCents,0),actual=spent(selectedMonth),allocSum=a.reduce((s,x)=>s+x.plannedCents,0);return `<div class="pagehead"><div><div class="eyebrow">Monthly planning workspace</div><h1>Budget</h1><p>Plan what you expect to spend, then compare it with what you actually record.</p></div><div class="headbuttons"><button class="btn" data-action="copy-month">${icon('repeat')} Copy previous month</button><button class="btn primary" data-action="new-budget">${icon('plus')} Set budget</button></div></div><div class="month-nav"><h2>${monthFmt(selectedMonth)}</h2><div class="nav-controls"><button class="iconbtn" data-action="prev-month" aria-label="Previous month">${icon('chevronLeft')}</button><button class="btn small" data-action="current-month">Today</button><button class="iconbtn" data-action="next-month" aria-label="Next month">${icon('chevronRight')}</button></div></div><section class="card summary-strip"><div class="summary-cell"><span>Planned spending</span><strong class="num">${money(planned)}</strong></div><div class="summary-cell"><span>Actual spending</span><strong class="num">${money(actual)}</strong></div><div class="summary-cell"><span>Remaining</span><strong class="num ${planned-actual<0?'negative':'positive'}">${money(planned-actual)}</strong></div><div class="summary-cell"><span>Planned savings</span><strong class="num">${money(b.plannedSavingsCents||0)}</strong></div></section><div class="budget-stack"><section class="card pad budget-overview"><div class="cardhead"><div><div class="eyebrow">How your plan is split</div><h2>Essentials vs flexible</h2><p>See the part of your budget that is committed versus easier to adjust.</p></div><span class="pill sage">Plan mix</span></div><div class="budget-mix-layout"><div>${essentialsMarkup(selectedMonth)}</div><div class="budget-mix-note"><strong>Student-friendly rule</strong>Protect essentials first. Flexible spending is the part you can slow down when the month gets tight.</div></div></section><section class="card pad"><div class="cardhead"><div><div class="eyebrow">Category detail</div><h2>Category budget</h2><p>${budgetSummary(a,allocSum)}</p></div><button class="btn small soft" data-action="new-allocation">${icon('plus')} Add category</button></div>${budgetListMarkup(a)}</section><section class="card pad"><div class="cardhead"><div><div class="eyebrow">Next to watch</div><h2>Upcoming commitments</h2><p>Scheduled items do not reduce actual spending until paid.</p></div><button class="linkbtn" data-action="navigate" data-page="bills">Manage ${icon('chevronRight')}</button></div>${comingUpMarkup(4)}</section></div>`;}
    function budgetSummary(a,allocSum){return a.length?a.length+' categories · '+money(allocSum)+' allocated':'Add the categories that matter most this month.';}
    function budgetListMarkup(a){return a.length?'<div class="budget-list-head"><span>Category</span><span>Planned</span><span>Actual</span><span>Remaining</span><span>Status</span><span>Actions</span></div><div>'+a.map(x=>budgetRow(x)).join('')+'</div>':emptyInline('Set a monthly budget and add category allocations to get a clear plan.','new-budget','Set monthly budget','budget');}
    function budgetRow(x){const cat=category(x.categoryId),actual=actualCategory(selectedMonth,x.categoryId),rem=x.plannedCents-actual,pct=x.plannedCents?actual/x.plannedCents*100:0;return `<div class="budget-row"><div class="budget-row-top"><div class="budget-category"><div class="budget-category-icon">${icon(cat.icon)}</div><div class="budget-category-copy"><strong>${esc(cat.name)}</strong><small>Category · ${esc(x.type)}</small></div></div><div class="budget-figure"><strong class="num">${money(x.plannedCents)}</strong></div><div class="budget-figure budget-actual"><strong class="num">${money(actual)}</strong></div><div class="budget-remaining num ${rem<0?'negative':'positive'}">${rem>=0?money(rem):'−'+money(Math.abs(rem))}</div><div class="budget-status"><span class="pill ${pct>100?'coral':pct>=80?'amber':'sage'}">${pct>100?'Over':Math.round(pct)+'%'}</span></div><div class="budget-row-actions"><button class="btn small soft budget-edit" data-action="edit-allocation" data-id="${x.id}" aria-label="Edit ${esc(cat.name)} budget">${icon('edit')} <span>Edit</span></button><button class="iconbtn danger budget-delete" data-action="delete-allocation" data-id="${x.id}" aria-label="Remove ${esc(cat.name)} from budget" title="Remove from budget">${icon('trash')}</button></div></div><div class="budget-row-bottom"><div class="category-rail"><span class="${pct>100?'over':pct>=80?'warn':''}" style="width:${clamp(pct,0,100)}%"></span></div></div></div>`;}
    function essentialsMarkup(m){const a=allocations(m);const e=a.filter(x=>x.type==='Essential').reduce((s,x)=>s+x.plannedCents,0),f=a.filter(x=>x.type==='Flexible').reduce((s,x)=>s+x.plannedCents,0);const total=e+f,essentialPct=total?e/total*100:0,flexiblePct=total?f/total*100:0;return `<div class="small-facts"><div><span>Essentials planned</span><strong class="num">${money(e)}</strong></div><div><span>Flexible planned</span><strong class="num">${money(f)}</strong></div><div><span>Flexible remaining</span><strong class="num">${money(flexibleRemaining(m))}</strong></div></div><div class="meter budget-mix-meter"><span class="essential" style="width:${essentialPct}%"></span><span class="flexible" style="width:${flexiblePct}%"></span></div><div class="legend"><span><i class="sage"></i> Essentials</span><span><i class="gold"></i> Flexible</span></div>`;}

    function sectionTabs(pageId,tab,items){return items.map(([id,label])=>'<button class="tab '+(tab===id?'active':'')+'" data-action="subtab" data-page="'+pageId+'" data-tab="'+id+'">'+label+'</button>').join('');}
    function incomeExpensesPage(){const tab=activeTab['income-expenses']||'income',head=tab==='income'?'<button class="btn primary" data-action="new-income">'+icon('arrowUp')+' Add income</button>':tab==='expenses'?'<button class="btn primary" data-action="quick">'+icon('arrowDown')+' Add expense</button>':'';return `<div class="income-expenses-page"><div class="pagehead"><div><div class="eyebrow">Actual money movement</div><h1>Income & Expenses</h1><p>Record what came in and what you really spent. Future plans stay separate.</p></div><div class="headbuttons">${head}</div></div><div class="tabs">${sectionTabs('income-expenses',tab,[['income','Income'],['expenses','Expenses'],['transactions','Transactions']])}</div>${tab==='income'?incomeTab():tab==='expenses'?expensesTab():transactionsTab()}</div>`;}
    function fundingMixRows(mix){return mix.map(x=>'<div class="row"><div class="rowicon">'+icon(x.type==='Earned'?'arrowUp':x.type==='Borrowed'?'receipt':'graduation')+'</div><div><div class="rowtitle">'+x.type+'</div><div class="rowmeta">'+(x.type==='Borrowed'?'May need to be repaid later.':x.type==='Support / Aid'?'Scholarships, grants and family support.':'Work, wages or earned income.')+'</div></div><div class="rowmoney num">'+money(x.amount)+'</div></div>').join('');}
    function incomeBreakdownMarkup(mix,total){return mix.map(x=>'<div class="income-breakdown-card"><div class="rowicon">'+icon(x.type==='Earned'?'arrowUp':x.type==='Borrowed'?'receipt':'graduation')+'</div><strong class="num">'+money(x.amount)+'</strong><span>'+x.type+'</span><div class="income-share-track"><span class="income-share-fill" style="width:'+(total?x.amount/total*100:0)+'%"></span></div></div>').join('');}
    function incomeSummaryMarkup(list,receivedC){const next=state.incomeOccurrences.filter(x=>x.status==='expected'&&x.expectedDate>=today()).sort((a,b)=>a.expectedDate.localeCompare(b.expectedDate))[0],recurring=sum(state.recurringIncomeDefinitions.filter(x=>x.status!=='ended'),'amountCents'),sources={};list.forEach(t=>{const key=t.name||'Other income';sources[key]=(sources[key]||0)+t.amount;});const main=Object.entries(sources).sort((a,b)=>b[1]-a[1])[0];return `<section class="card summary-strip income-expense-summary"><div class="summary-cell"><span>Received this month</span><strong class="num positive">${money(receivedC)}</strong><small>Actual income</small></div><div class="summary-cell"><span>Next income</span><strong>${next?dateFmt(next.expectedDate,true):'None planned'}</strong><small>${next?money(next.expectedAmount)+' expected':'Add a recurring plan'}</small></div><div class="summary-cell"><span>Recurring income</span><strong class="num">${money(recurring)}</strong><small>${recurring?'Saved income plans':'No active plans'}</small></div><div class="summary-cell"><span>Main source</span><strong>${main?esc(main[0]):'Not recorded'}</strong><small>${main?'Highest this month':'Add income to see this'}</small></div></section>`;}
    function expenseSummaryMarkup(list){const total=sum(list),byCategory={};list.forEach(t=>{const key=category(t.categoryId).name;byCategory[key]=(byCategory[key]||0)+t.amount;});const largest=Object.entries(byCategory).sort((a,b)=>b[1]-a[1])[0],average=list.length?total/list.length:0;return `<section class="card summary-strip income-expense-summary"><div class="summary-cell"><span>Spent this month</span><strong class="num negative">${money(total)}</strong><small>Actual expenses</small></div><div class="summary-cell"><span>Largest category</span><strong>${largest?esc(largest[0]):'None yet'}</strong><small>${largest?money(largest[1])+' spent':'Add an expense'}</small></div><div class="summary-cell"><span>Average entry</span><strong class="num">${money(average)}</strong><small>${list.length?'Across this month':'No entries yet'}</small></div><div class="summary-cell"><span>Records this month</span><strong>${list.length}</strong><small>${list.length===1?'Expense recorded':'Expenses recorded'}</small></div></section>`;}
    function incomeTab(){const m=selectedMonth,list=incomeFor(m),receivedC=sum(list),mix=['Earned','Support / Aid','Borrowed'].map(type=>({type,amount:sum(list.filter(t=>t.fundingType===type))}));return `${incomeSummaryMarkup(list,receivedC)}<div class="grid two"><section class="card pad income-summary-card"><div class="cardhead"><div><div class="eyebrow">Confirmed money</div><h2>Income breakdown</h2><p>How your received income is split across funding types.</p></div><span class="pill sage">${list.length} record${list.length===1?'':'s'}</span></div><div class="income-breakdown">${incomeBreakdownMarkup(mix,receivedC)}</div><div class="income-note">${icon('info')}<span>Expected income stays separate until you mark it received.</span></div></section><section class="card pad"><div class="cardhead"><div><div class="eyebrow">Where it came from</div><h2>Funding mix</h2><p>Borrowed money stays separate from earned income.</p></div></div>${fundingMixRows(mix)}</section></div><section class="card pad" style="margin-top:19px"><div class="cardhead"><div><div class="eyebrow">Activity</div><h2>Recent income</h2><p>Actual received records in ${monthFmt(m)}.</p></div><button class="btn small student-action" data-action="new-recurring-income">${icon('repeat')} Add recurring plan</button></div>${incomeTable(list)}</section>${recurringIncomeMarkup()}`;}
    function incomeTable(list){if(!list.length)return emptyInline('Add income or funding when you receive it.','new-income','Add income','arrowUp');return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Source</th><th>Funding type</th><th>Term</th><th class="right">Amount</th><th></th></tr></thead><tbody>${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${dateFmt(t.date,true)}</td><td><strong>${esc(t.name||'Income')}</strong><div class="muted">${esc(category(t.categoryId).name)}</div></td><td><span class="pill ${t.fundingType==='Borrowed'?'amber':t.fundingType==='Support / Aid'?'gold':'sage'}">${esc(t.fundingType||'Earned')}</span></td><td>${t.termId?esc(term(t.termId)?.name||'Term'):'—'}</td><td class="right num positive">+${money(t.amount)}</td><td class="actions"><button class="iconbtn table-action" data-action="edit-transaction" data-id="${t.id}" title="Edit record" aria-label="Edit record">${icon('edit')}</button><button class="iconbtn table-action danger" data-action="delete-transaction" data-id="${t.id}" title="Delete record" aria-label="Delete record">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>`;}
    function recurringIncomeMarkup(){const plans=state.recurringIncomeDefinitions.filter(x=>x.status!=='ended');if(!plans.length)return '';return `<section class="card pad recurring-income-card" style="margin-top:19px"><div class="cardhead"><div><h2>Recurring income plans</h2><p>Expected income does not count as received until you mark it received.</p></div><button class="btn small" data-action="new-recurring-income">${icon('plus')} New plan</button></div>${plans.map(p=>{const next=state.incomeOccurrences.filter(o=>o.definitionId===p.id&&o.status==='expected').sort((a,b)=>a.expectedDate.localeCompare(b.expectedDate))[0];return `<div class="row recurring-income-row"><div class="rowicon">${icon('repeat')}</div><div class="recurring-income-copy"><div class="rowtitle">${esc(p.name)}</div><div class="rowmeta">${esc(p.frequency)} · ${esc(p.fundingType)} · Expected ${next?dateFmt(next.expectedDate):'—'}</div></div><div class="actions recurring-actions"><span class="rowmoney num">${money(p.amountCents)}</span><button class="btn small soft" data-action="receive-recurring" data-id="${p.id}">Receive</button></div></div>`;}).join('')}</section>`;}
    function expensesTab(){const m=selectedMonth,list=expensesFor(m);return `${expenseSummaryMarkup(list)}<section class="card pad"><div class="cardhead"><div><div class="eyebrow">Actual spending</div><h2>Expense history</h2><p>Expenses, bill payments, subscription payments and education payments.</p></div></div>${expenseTable(list)}</section>`;}
    function expenseTable(list){if(!list.length)return emptyInline('Your daily spending will appear here.','quick','Add expense','receipt');const sorted=list.slice().sort((a,b)=>b.date.localeCompare(a.date)),limit=expenseHistoryExpanded?sorted.length:12,shown=sorted.slice(0,limit);return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Source</th><th class="right">Amount</th><th></th></tr></thead><tbody>${shown.map(t=>`<tr><td>${dateFmt(t.date,true)}</td><td><strong>${esc(t.name||category(t.categoryId).name)}</strong><div class="muted">${esc(t.note||'')}</div></td><td>${esc(category(t.categoryId).name)}</td><td>${t.type==='billPayment'?'Bill payment':t.type==='subscriptionPayment'?'Subscription':t.type==='educationPayment'?'Education cost':'Expense'}</td><td class="right num negative">−${money(t.amount)}</td><td class="actions">${['expense','educationPayment'].includes(t.type)?`<button class="iconbtn table-action" data-action="edit-transaction" data-id="${t.id}" title="Edit record" aria-label="Edit record">${icon('edit')}</button>`:''}<button class="iconbtn table-action danger" data-action="delete-transaction" data-id="${t.id}" title="Delete record" aria-label="Delete record">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>${sorted.length>12?`<div class="transaction-history-footer"><span>Showing <strong>${shown.length}</strong> of <strong>${sorted.length}</strong> expenses this month.</span>${expenseHistoryExpanded?'<button class="btn small" data-action="show-recent-expenses">Show recent 12</button>':'<button class="btn small primary" data-action="show-full-expenses">Show full history</button>'}</div>`:''}`;}
    function transactionsTab(){const list=state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card transaction-filter-card"><div class="toolbar" style="margin:0"><div class="field"><label for="tx-search">Search transactions</label><input id="tx-search" data-filter="tx-search" value="${esc(transactionQuery)}" placeholder="Search description, category or note"></div><div class="field"><label for="tx-type">Type</label><select id="tx-type" data-filter="tx-type"><option value="" ${transactionTypeFilter===''?'selected':''}>All types</option><option value="income" ${transactionTypeFilter==='income'?'selected':''}>Income</option><option value="expense" ${transactionTypeFilter==='expense'?'selected':''}>Expense</option><option value="billPayment" ${transactionTypeFilter==='billPayment'?'selected':''}>Bill payment</option><option value="subscriptionPayment" ${transactionTypeFilter==='subscriptionPayment'?'selected':''}>Subscription payment</option><option value="educationPayment" ${transactionTypeFilter==='educationPayment'?'selected':''}>Education payment</option><option value="savingsContribution" ${transactionTypeFilter==='savingsContribution'?'selected':''}>Savings contribution</option></select></div></div></section><section class="card pad"><div class="cardhead"><div><h2>All transactions</h2><p>One unified log of actual activity.</p></div></div>${timelineTable(list)}</section>`;}
    function timelineTable(list){const q=transactionQuery.toLowerCase(),typ=transactionTypeFilter;const filtered=list.filter(t=>(!q||`${t.name||''} ${t.note||''} ${t.categoryId?category(t.categoryId).name:''} ${t.date||''} ${dateFmt(t.date,true)} ${monthFmt(monthOf(t.date))}`.toLowerCase().includes(q))&&(!typ||t.type===typ));if(!filtered.length)return emptyInline('Start tracking activity to see your money timeline.','quick','Add expense','receipt');const limit=transactionHistoryExpanded?filtered.length:12,shown=filtered.slice(0,limit);return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead><tbody>${shown.map(t=>`<tr><td>${dateFmt(t.date,true)}</td><td><strong>${esc(t.name||'Activity')}</strong><div class="muted">${esc(t.note||'')}</div></td><td><span class="pill ${isActualIncome(t)?'sage':isContribution(t)?'gold':'soft'}">${txLabel(t.type)}</span></td><td>${t.categoryId?esc(category(t.categoryId).name):t.targetId?esc(targetName(t.targetId)):'—'}</td><td class="right num ${isActualIncome(t)?'positive':isContribution(t)?'':'negative'}">${isActualIncome(t)?'+':'−'}${money(t.amount)}</td><td class="actions">${['income','expense'].includes(t.type)?`<button class="iconbtn table-action" data-action="edit-transaction" data-id="${t.id}" title="Edit transaction" aria-label="Edit transaction">${icon('edit')}</button>`:''}<button class="iconbtn table-action danger" data-action="delete-transaction" data-id="${t.id}" title="Delete transaction" aria-label="Delete transaction">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>${filtered.length>12?`<div class="transaction-history-footer"><span>Showing <strong>${shown.length}</strong> of <strong>${filtered.length}</strong> matching transactions.</span>${transactionHistoryExpanded?'<button class="btn small" data-action="show-recent-transactions">Show recent 12</button>':'<button class="btn small primary" data-action="show-full-history">Show full history</button>'}</div>`:''}`;}
    function txLabel(t){return ({income:'Income',expense:'Expense',billPayment:'Bill payment',subscriptionPayment:'Subscription payment',educationPayment:'Education payment',savingsContribution:'Savings contribution'})[t]||t;}

    function semesterPage(){const tab=activeTab.semester||'plan';const actions=tab==='plan'?`<button class="btn" data-action="new-term">${icon('plus')} Add term</button><button class="btn primary" data-action="new-education">${icon('plus')} Add education cost</button>`:`<button class="btn primary" data-action="${tab==='costs'?'new-education':'new-funding'}">${icon('plus')} ${tab==='costs'?'Add education cost':'Add funding'}</button>`;return `<div class="pagehead"><div><div class="eyebrow">Student-specific planning</div><h1>Semester & Education Costs</h1><p>Understand what your term will cost and how you plan to cover it.</p></div><div class="headbuttons">${actions}</div></div><div class="tabs">${[['plan','Semester Plan'],['costs','Education Costs'],['funding','Funding']].map(([id,l])=>`<button class="tab ${tab===id?'active':''}" data-action="subtab" data-page="semester" data-tab="${id}">${l}</button>`).join('')}</div>${tab==='plan'?semesterPlanTab():tab==='costs'?educationCostsTab():fundingTab()}`;}
    function semesterPlanTab(){const current=currentTerm();if(!state.terms.length)return `<section class="card empty"><div class="empty-icon">${icon('graduation')}</div><h2>Add your current term</h2><p>Add a semester, quarter, trimester or custom term to plan tuition, books and study costs.</p><button class="btn primary" data-action="new-term">${icon('plus')} Add term</button></section>`;return `<div class="grid two"><section class="card pad">${current?`<div class="cardhead"><div><div class="eyebrow">Current term</div><h2>${esc(current.name)}</h2><p>${dateFmt(current.startDate)} – ${dateFmt(current.endDate)} · ${termProgress(current)}% calendar progress</p></div><div class="term-card-side"><span class="pill sage">${current.type}</span><button class="iconbtn" data-action="edit-term" data-id="${current.id}" aria-label="Edit current term">${icon('edit')}</button></div></div>${semesterSnapshotMarkup(current)}`:emptyInline('Choose a current term to see its plan.','new-term','Add term','graduation')}</section><section class="card pad"><div class="cardhead"><div><h2>All terms</h2><p>Historical terms stay preserved.</p></div></div>${state.terms.map(t=>`<div class="row"><div class="rowicon">${icon('calendar')}</div><div><div class="rowtitle">${esc(t.name)} ${state.settings.currentTermId===t.id?'<span class="pill sage" style="margin-left:6px">Current</span>':''}</div><div class="rowmeta">${dateFmt(t.startDate,true)} – ${dateFmt(t.endDate,true)} · ${money(termActual(t))} paid</div></div><div class="actions term-row-actions"><button class="btn small soft" data-action="set-current-term" data-id="${t.id}">${state.settings.currentTermId===t.id?'Current':'Set current'}</button><button class="iconbtn term-edit-action" title="Edit term" aria-label="Edit term" data-action="edit-term" data-id="${t.id}">${icon('edit')}</button></div></div>`).join('')}</section></div>`;}
    function educationCostsTab(){const current=currentTerm();const list=state.educationCostItems.slice().sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));return `<section class="card pad"><div class="cardhead"><div><h2>Education cost plan</h2><p>Planned costs do not become expenses until you record a payment.</p></div></div>${list.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Cost item</th><th>Term</th><th>Due</th><th>Planned</th><th>Paid</th><th>Remaining</th><th></th></tr></thead><tbody>${list.map(item=>{const paid=itemPaid(item),rem=item.plannedCents-paid;return `<tr><td><strong>${esc(item.name)}</strong><div class="muted">${esc(item.category)}</div></td><td>${esc(term(item.termId)?.name||'—')}</td><td>${item.dueDate?dateFmt(item.dueDate,true):'—'}</td><td class="num">${money(item.plannedCents)}</td><td class="num positive">${money(paid)}</td><td class="num ${rem<0?'negative':''}">${money(rem)}</td><td class="actions"><button class="btn small soft education-payment-action" data-action="record-education" data-id="${item.id}">Record payment</button><button class="iconbtn education-edit-action" data-action="edit-education" data-id="${item.id}" title="Edit education cost" aria-label="Edit education cost">${icon('edit')}</button></td></tr>`;}).join('')}</tbody></table></div>`:emptyInline('Add your current term to plan tuition, books and study costs.','new-education','Add education cost','graduation')}</section>`;}
    function fundingTab(){const current=currentTerm();const list=current?state.termFundingPlans.filter(x=>x.termId===current.id):[];const planned=sum(list,'plannedCents'), receivedF=sum(list,'receivedCents'), costs=current?termPlanned(current):0,gap=costs-planned;return `<div class="grid two"><section class="card pad"><div class="cardhead"><div><h2>Funding plan${current?' · '+esc(current.name):''}</h2><p>Plan where your education money will come from, then record it when received.</p></div></div>${current?`<div class="metric-row"><strong class="num">${money(planned)}</strong><span>${gap>0?money(gap)+' additional funding needed':money(Math.abs(gap))+' planned surplus'}</span></div><div class="small-facts"><div><span>Planned education costs</span><strong class="num">${money(costs)}</strong></div><div><span>Actual received</span><strong class="num positive">${money(receivedF)}</strong></div><div><span>Funding gap / surplus</span><strong class="num ${gap>0?'warning':'positive'}">${money(Math.abs(gap))}</strong></div></div><div class="funding-divider" aria-hidden="true"></div>${list.length?list.map(x=>`<div class="row"><div class="rowicon">${icon(x.type==='Student Loan'?'receipt':'graduation')}</div><div><div class="rowtitle">${esc(x.name)}</div><div class="rowmeta">${esc(x.type)} · Planned ${money(x.plannedCents)} · Received ${money(x.receivedCents||0)}</div></div><div class="actions funding-row-actions"><button class="btn small soft" data-action="receive-funding" data-id="${x.id}">Receive</button><button class="iconbtn funding-edit-action" data-action="edit-funding" data-id="${x.id}" title="Edit funding" aria-label="Edit funding">${icon('edit')}</button></div></div>`).join(''):emptyInline('Add scholarships, grants, work income, family support or savings.','new-funding','Add planned funding','graduation')}`:emptyInline('Add a current term before setting a funding plan.','new-term','Add term','graduation')}</section><section class="card pad funding-language-card"><div class="cardhead"><div><h2>Funding types</h2><p>Use these simple labels when planning support.</p></div></div><div class="funding-type-list"><div class="row"><div class="rowicon">${icon('arrowUp')}</div><div><div class="rowtitle">Earned</div><div class="rowmeta">Work or wages.</div></div></div><div class="row"><div class="rowicon">${icon('graduation')}</div><div><div class="rowtitle">Support / Aid</div><div class="rowmeta">Scholarships, grants or family support.</div></div></div><div class="row"><div class="rowicon">${icon('receipt')}</div><div><div class="rowtitle">Borrowed</div><div class="rowmeta">Money that may need repayment.</div></div></div></div></section></div>`;}

    function commitmentPageAction(tab){if(tab==='bills')return '<button class="btn primary" data-action="new-bill">'+icon('plus')+' Add bill</button>';if(tab==='subscriptions')return '<button class="btn primary" data-action="new-subscription">'+icon('repeat')+' Add subscription</button>';return '';}
    function commitmentListMarkup(list,kind,action,label,ico){return list.length?'<div class="commitment-grid">'+list.map(b=>commitmentCard(b,kind)).join('')+'</div>':emptyInline(kind==='bill'?'No bills added yet.':'No subscriptions added yet.',action,label,ico);}
    function billsPage(){const tab=activeTab.bills||'bills';return `<div class="pagehead"><div><div class="eyebrow">Bills, renewals and due dates</div><h1>Bills & Subscriptions</h1><p>Plan recurring commitments without treating future dates as already paid.</p></div><div class="headbuttons">${commitmentPageAction(tab)}</div></div><div class="tabs">${sectionTabs('bills',tab,[['bills','Bills'],['subscriptions','Subscriptions'],['calendar','Calendar']])}</div>${tab==='bills'?billsTab():tab==='subscriptions'?subscriptionsTab():calendarTab()}`;}
    function billsTab(){const list=state.billDefinitions.filter(x=>x.status!=='deleted');return `<section class="card pad"><div class="cardhead"><div><div class="eyebrow">Scheduled commitments</div><h2>Bill definitions</h2><p>Each bill has a schedule, occurrences and actual payments.</p></div><span class="pill gold">${list.length} bill${list.length===1?'':'s'}</span></div>${commitmentListMarkup(list,'bill','new-bill','Add bill','receipt')}</section>`;}
    function subscriptionsTab(){const list=state.subscriptionDefinitions.filter(x=>x.status!=='deleted');return `<section class="card pad"><div class="cardhead"><div><div class="eyebrow">Recurring services</div><h2>Subscriptions</h2><p>Free trials stay free until the first paid billing date.</p></div><span class="pill gold">${list.length} subscription${list.length===1?'':'s'}</span></div>${commitmentListMarkup(list,'subscription','new-subscription','Add subscription','repeat')}</section>`;}
    function commitmentCard(item,kind){const occ=(kind==='bill'?state.billOccurrences:state.subscriptionCycles).filter(x=>x.definitionId===item.id).sort((a,b)=>(a.dueDate||a.billingDate).localeCompare(b.dueDate||b.billingDate)),next=occ.find(x=>x.status!=='paid'&&x.status!=='cancelled'),paid=occ.filter(x=>x.status==='paid').length,isTrial=kind==='subscription'&&next?.isTrial,status=isTrial?'Trial':next?statusLabel(next):item.status==='paused'?'Paused':'Ended',statusClass=isTrial?'amber':next?.status==='overdue'?'coral':item.status==='paused'?'soft':'gold',nextDate=next?(dateFmt(next.dueDate||next.billingDate,true)):'—',primary=next&&!isTrial?'<button class="btn soft" data-action="pay-commitment" data-kind="'+kind+'" data-id="'+item.id+'" data-occurrence="'+next.id+'">'+icon('check')+' Pay '+(kind==='bill'?'bill':'subscription')+'</button>':'';return `<article class="card commitment-card"><div class="commitment-head"><div class="commitment-title"><div class="rowicon">${icon(kind==='bill'?'receipt':'repeat')}</div><div><strong>${esc(item.name)}</strong><span>${esc(category(item.categoryId).name)}${item.status!=='active'?' · '+esc(item.status):''}</span></div></div><span class="pill ${statusClass}">${status}</span></div><div class="commitment-amount num">${money(item.amountCents)}</div><div class="commitment-detail-grid"><div class="commitment-detail"><span>Frequency</span><strong>${esc(item.frequency)}</strong></div><div class="commitment-detail"><span>${isTrial?'Trial ends':'Next due'}</span><strong>${isTrial?dateFmt(item.trialEndDate,true):nextDate}</strong></div><div class="commitment-detail"><span>${isTrial?'First paid billing':'Payment account'}</span><strong>${isTrial?dateFmt(item.firstPaidDate,true):esc(item.paymentAccount||item.method||'Not set')}</strong></div></div><div class="commitment-actions">${primary}<button class="iconbtn commitment-action-icon" data-action="edit-commitment" data-kind="${kind}" data-id="${item.id}" aria-label="Edit ${esc(item.name)}">${icon('edit')}</button><button class="iconbtn commitment-action-icon" data-action="pause-commitment" data-kind="${kind}" data-id="${item.id}" aria-label="${item.status==='active'?'Pause':'Resume'} ${esc(item.name)}">${item.status==='active'?icon('pause'):icon('play')}</button></div><button class="linkbtn commitment-history" data-action="payment-history" data-kind="${kind}" data-id="${item.id}">${icon('history')}<span>Payment history</span><strong>${paid}</strong></button><button class="btn small commitment-end" data-action="end-commitment" data-kind="${kind}" data-id="${item.id}">${icon('close')} End recurrence</button></article>`;}
    function statusLabel(o){if(o.status==='paid')return 'Paid';const d=o.dueDate||o.billingDate;if(d<today())return 'Overdue';if(d===today())return 'Due today';const diff=Math.round((parseDate(d)-parseDate(today()))/86400000);return diff<=5?'Due soon':'Upcoming';}
    function calendarTab(){const m=selectedMonth;return `<section class="card pad"><div class="month-nav"><h2>${monthFmt(m)}</h2><div class="nav-controls"><button class="iconbtn" data-action="prev-month">${icon('chevronLeft')}</button><button class="btn small" data-action="current-month">Today</button><button class="iconbtn" data-action="next-month">${icon('chevronRight')}</button></div></div>${calendarMarkup(m)}<div class="legend"><span><i class="gold"></i> Planned bill / renewal</span><span><i class="sage"></i> Paid payment</span><span><i class="coral"></i> Trial or education date</span></div></section>`;}
    function calendarMarkup(m){const [y,mo]=m.split('-').map(Number),first=new Date(y,mo-1,1),start=(first.getDay()+6)%7,total=daysInMonth(y,mo);let cells='<div class="calendar-grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="calendar-weekday">${d}</div>`).join('');for(let i=0;i<42;i++){const day=i-start+1;if(day<1||day>total){cells+='<div class="calendar-day muted-day"></div>';continue;}const date=`${y}-${pad(mo)}-${pad(day)}`,events=calendarEvents(date);cells+=`<div class="calendar-day ${date===today()?'today ':''}${events.length?'has-events':''}"><div class="calendar-number"><span>${day}</span></div>${events.slice(0,3).map(e=>`<button class="calendar-event ${e.actual?'actual':''} ${e.trial?'trial':''}" data-action="day-agenda" data-date="${date}">${esc(e.label)}</button>`).join('')}${events.length>3?`<button class="linkbtn" data-action="day-agenda" data-date="${date}">+${events.length-3} more</button>`:''}</div>`;}return cells+'</div>';}
    function calendarEvents(date){const ev=[];for(const o of state.billOccurrences.filter(x=>(x.dueDate===date||x.paymentDate===date)))ev.push({label:`${o.status==='paid'?'✓ ':''}${o.name||'Bill'}`,actual:o.status==='paid',amount:o.actualAmount||o.expectedAmount||0,kind:'bill',id:o.definitionId});for(const o of state.subscriptionCycles.filter(x=>x.billingDate===date||x.paymentDate===date))ev.push({label:`${o.isTrial?'Trial: ':'↻ '}${o.name||'Subscription'}`,actual:o.status==='paid',trial:o.isTrial,amount:o.actualAmount||o.expectedAmount||0,kind:'subscription',id:o.definitionId});for(const c of state.educationCostItems.filter(x=>x.dueDate===date))ev.push({label:`School: ${c.name}`,trial:true,amount:c.plannedCents||0});for(const t of state.terms.filter(x=>x.startDate===date||x.endDate===date))ev.push({label:`Term: ${t.name}`,trial:true});return ev;}

    function savingsPageAction(tab){if(tab==='goals')return '<button class="btn primary" data-action="new-goal">'+icon('plus')+' Add goal</button>';if(tab==='funds')return '<button class="btn primary" data-action="new-fund">'+icon('wallet')+' Add sinking fund</button>';return '<button class="btn primary" data-action="new-contribution">'+icon('plus')+' Add contribution</button>'; }
    function targetListMarkup(kind,list){return list.length?'<div class="goal-grid">'+list.map(g=>targetLargeCard(g)).join('')+'</div>':emptyInline(kind==='goal'?'Create a savings goal for something that matters to you.':'Create a fund for a known future cost.','new-'+(kind==='goal'?'goal':'fund'),'Create '+(kind==='goal'?'goal':'fund'),'target');}
    function targetsTab(kind){const list=kind==='goal'?state.savingsGoals:state.sinkingFunds;return `<section class="card pad"><div class="cardhead"><div><div class="eyebrow">${kind==='goal'?'Goals':'Sinking funds'}</div><h2>${kind==='goal'?'Savings goals':'Sinking funds'}</h2><p>${kind==='goal'?'For something meaningful or an important cushion.':'For a known future cost you can build gradually.'}</p></div><span class="pill ${kind==='goal'?'gold':'sage'}">${list.length} item${list.length===1?'':'s'}</span></div>${targetListMarkup(kind,list)}</section>`;}
    function targetLargeCard(g){const sc=goalSaved(g),pct=g.targetCents?clamp(sc/g.targetCents*100,0,100):0,remaining=Math.max(0,g.targetCents-sc);return `<article class="goal-card"><div class="goal-top"><div class="goal-icon">${icon(g.kind==='fund'?'wallet':'target')}</div><span class="pill ${pct>=100?'sage':'gold'}">${pct>=100?'Complete':g.kind==='fund'?'Sinking fund':'Active'}</span></div><h3>${esc(g.name)}</h3><div class="goal-amount num">${money(sc)} <span class="muted" style="font-size:.75rem;font-weight:500">of ${money(g.targetCents)}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-meta"><span>${Math.round(pct)}% reached</span><span>${money(remaining)} left</span></div>${g.targetDate?'<div class="rowmeta" style="margin-top:10px">Target date: '+dateFmt(g.targetDate)+'</div>':''}<div class="target-actions"><button class="btn small student-action" data-action="contribute" data-id="${g.id}">${icon('plus')} Contribute</button><button class="iconbtn goal-action" data-action="edit-target" data-id="${g.id}" aria-label="Edit ${esc(g.name)}">${icon('edit')}</button><button class="iconbtn danger goal-action" data-action="delete-target" data-id="${g.id}" aria-label="Delete ${esc(g.name)}">${icon('trash')}</button></div>${pct>=100?'<div class="hint positive" style="margin-top:12px">'+icon('spark')+' '+esc(g.name)+' goal reached.</div>':''}</article>`;}
    function contributionsTab(){const list=state.savingsContributions.slice().sort((a,b)=>b.date.localeCompare(a.date)),shown=contributionHistoryExpanded?list:list.slice(0,12);return `<section class="card pad"><div class="cardhead"><div><h2>Contributions</h2><p>Actual saved amounts come from these records.</p></div><span class="pill gold">Saved records</span></div>${list.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Goal / fund</th><th>Note</th><th class="right">Amount</th><th></th></tr></thead><tbody>${shown.map(c=>`<tr><td>${dateFmt(c.date,true)}</td><td><strong>${esc(targetName(c.targetId))}</strong></td><td>${esc(c.notes||'')}</td><td class="right num positive">+${money(c.amountCents)}</td><td class="contribution-actions"><button class="iconbtn savings-action-icon" data-action="edit-contribution" data-id="${c.id}" title="Edit contribution" aria-label="Edit contribution">${icon('edit')}</button><button class="iconbtn danger savings-action-icon" data-action="delete-contribution" data-id="${c.id}" title="Delete contribution" aria-label="Delete contribution">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>${list.length>12?`<div class="transaction-history-footer"><span>Showing <strong>${shown.length}</strong> of <strong>${list.length}</strong> contributions.</span>${contributionHistoryExpanded?'<button class="btn small" data-action="show-recent-contributions">Show recent 12</button>':'<button class="btn small primary" data-action="show-full-contributions">Show full history</button>'}</div>`:''}`:emptyInline('Your savings contributions will appear here.','new-contribution','Add contribution','target')}</section>`;}

    const CURRENCY_OPTIONS=[['USD','US Dollar','United States'],['AED','UAE Dirham','United Arab Emirates'],['ARS','Argentine Peso','Argentina'],['AUD','Australian Dollar','Australia'],['BDT','Bangladeshi Taka','Bangladesh'],['BRL','Brazilian Real','Brazil'],['CAD','Canadian Dollar','Canada'],['CHF','Swiss Franc','Switzerland'],['CLP','Chilean Peso','Chile'],['CNY','Chinese Yuan','China'],['COP','Colombian Peso','Colombia'],['CZK','Czech Koruna','Czechia'],['DKK','Danish Krone','Denmark'],['EGP','Egyptian Pound','Egypt'],['EUR','Euro','European Union'],['GBP','British Pound','United Kingdom'],['HKD','Hong Kong Dollar','Hong Kong'],['HUF','Hungarian Forint','Hungary'],['IDR','Indonesian Rupiah','Indonesia'],['INR','Indian Rupee','India'],['JPY','Japanese Yen','Japan'],['KES','Kenyan Shilling','Kenya'],['KRW','South Korean Won','South Korea'],['MAD','Moroccan Dirham','Morocco'],['MYR','Malaysian Ringgit','Malaysia'],['NGN','Nigerian Naira','Nigeria'],['NOK','Norwegian Krone','Norway'],['NZD','New Zealand Dollar','New Zealand'],['PHP','Philippine Peso','Philippines'],['PKR','Pakistani Rupee','Pakistan'],['PLN','Polish Zloty','Poland'],['QAR','Qatari Riyal','Qatar'],['RON','Romanian Leu','Romania'],['RUB','Russian Ruble','Russia'],['SAR','Saudi Riyal','Saudi Arabia'],['SEK','Swedish Krona','Sweden'],['SGD','Singapore Dollar','Singapore'],['THB','Thai Baht','Thailand'],['TRY','Turkish Lira','Türkiye'],['UAH','Ukrainian Hryvnia','Ukraine'],['VND','Vietnamese Dong','Vietnam'],['ZAR','South African Rand','South Africa']];
    function currencySuggestions(input){const q=String(input?.value||'').trim().toUpperCase();return CURRENCY_OPTIONS.filter(x=>!q||x.join(' ').toUpperCase().includes(q)).slice(0,8);}
    function filterCurrencySuggestions(input){const host=input?.closest('.currency-picker')?.querySelector('.currency-suggestions');if(!host)return;const list=currencySuggestions(input);host.innerHTML=list.map(x=>`<button type="button" class="currency-suggestion" onclick="selectCurrencySuggestion('${x[0]}')"><strong>${x[0]}</strong><span>${x[1]}<small>${x[2]}</small></span></button>`).join('');host.hidden=!list.length;}

    async function saveGeneralSettings(event){event.preventDefault();const name=document.getElementById('setting-name')?.value.trim()||'',currency=(document.getElementById('setting-currency')?.value||'USD').trim().toUpperCase(),dateFormat=document.getElementById('setting-date-format')?.value||'written',numberFormat=document.getElementById('setting-number-format')?.value||'auto',language=document.getElementById('setting-language')?.value||'en';if(!/^[A-Z]{3}$/.test(currency))return showError(Error('Enter a valid 3-letter currency code or choose a suggestion.'));state.settings.name=name;state.settings.currency=currency;state.settings.language=language;state.settings.dateFormat=dateFormat;state.settings.numberFormat=numberFormat;await persist('General settings saved');render();}

    function dateFmt(date,short=false){if(!date)return '—';const d=parseDate(date);if(Number.isNaN(d.getTime()))return '—';const format=state?.settings?.dateFormat||'written';if(format==='iso')return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;if(format==='numeric'){const mm=pad(d.getMonth()+1),dd=pad(d.getDate());return short?`${mm}/${dd}`:`${mm}/${dd}/${d.getFullYear()}`;}return new Intl.DateTimeFormat(locale(),{month:'short',day:'numeric',year:short?undefined:'numeric'}).format(d);}
    function money(value,sign=true){const n=(Number(value)||0)/100,currency=state?.settings?.currency||'USD',format=state?.settings?.numberFormat||'auto';try{if(format==='plain')return `${new Intl.NumberFormat(locale(),{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)} ${currency}`;return new Intl.NumberFormat(locale(),{style:'currency',currency,currencyDisplay:format==='code'?'code':'symbol',maximumFractionDigits:2}).format(n);}catch{return `${sign?'$':''}${n.toFixed(2)}`;}}
    function number(value){const format=state?.settings?.numberFormat||'auto';return new Intl.NumberFormat(locale(),{useGrouping:format!=='plain',maximumFractionDigits:2}).format((Number(value)||0)/100);}
    function generalSettings(){const currency=state.settings.currency||'USD',dateFormat=state.settings.dateFormat||'written',numberFormat=state.settings.numberFormat||'auto';return `<section class="card pad"><div class="cardhead"><div><h2>General</h2><p>Choose how your name, currency, dates and amounts appear across the workspace.</p></div></div><form data-form="general-custom" onsubmit="saveGeneralSettings(event)"><div class="setting-row"><div><h3>Your name</h3><p>Optional. Used in your dashboard greeting.</p></div><div class="settings-control"><input id="setting-name" name="name" value="${esc(state.settings.name||'')}" maxlength="60" placeholder="Alex"></div></div><div class="setting-row"><div><h3>Language</h3><p>Choose the language used throughout the workspace.</p></div><div class="settings-control"><select id="setting-language" name="language"><option value="en" ${state.settings.language==='en'?'selected':''}>English</option><option value="es" ${state.settings.language==='es'?'selected':''}>Spanish</option><option value="fr" ${state.settings.language==='fr'?'selected':''}>French</option></select></div></div><div class="setting-row"><div><h3>Currency</h3><p>Search by a 3-letter code or currency name. Changing currency changes display only; stored amounts are not converted.</p></div><div class="settings-control currency-picker"><input id="setting-currency" name="currency" value="${esc(currency)}" maxlength="3" autocomplete="off" onfocus="filterCurrencySuggestions(this)" oninput="filterCurrencySuggestions(this)" onkeydown="chooseCurrencyWithKeyboard(event)"><div class="currency-suggestions" hidden></div></div></div><div class="setting-row"><div><h3>Date format</h3><p>Choose how dates appear in entries, reminders and reports.</p></div><div class="settings-control"><select id="setting-date-format" name="dateFormat"><option value="written" ${dateFormat==='written'?'selected':''}>Written · Sep 17, 2026</option><option value="numeric" ${dateFormat==='numeric'?'selected':''}>Numeric · 09/17/2026</option><option value="iso" ${dateFormat==='iso'?'selected':''}>ISO · 2026-09-17</option></select></div></div><div class="setting-row"><div><h3>Number format</h3><p>Automatic follows the selected currency; code and plain formats keep the display explicit.</p></div><div class="settings-control"><select id="setting-number-format" name="numberFormat"><option value="auto" ${numberFormat==='auto'?'selected':''}>Automatic · ${money(123456)}</option><option value="code" ${numberFormat==='code'?'selected':''}>Currency code · ${money(123456)}</option><option value="plain" ${numberFormat==='plain'?'selected':''}>Plain number · 1,234.56 ${currency}</option></select></div></div><div class="form-actions settings-save"><button class="btn primary" type="submit">Save general settings</button></div></form></section>`;}

    function bindSettingsContent(root){root.querySelector('[data-setting="currentTerm"]')?.addEventListener('change',async e=>{state.settings.currentTermId=e.target.value;await persist();render();});root.querySelectorAll('[data-threshold]').forEach(el=>el.addEventListener('change',async e=>{const n=Number(e.target.dataset.threshold);state.settings.budgetThresholds=e.target.checked?[...new Set([...state.settings.budgetThresholds,n])].sort((a,b)=>a-b):state.settings.budgetThresholds.filter(x=>x!==n);await persist();render();}));root.querySelectorAll('[data-notification]').forEach(el=>el.addEventListener('change',async e=>{state.settings.notifications[e.target.dataset.notification]=e.target.checked;syncNotifications();await persist();render();}));root.querySelectorAll('[data-form="general"], [data-form="appearance"]').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f).entries());if(f.dataset.form==='general'){state.settings.name=v.name.trim();state.settings.currency=v.currency;state.settings.language=v.language||'en';await persist('General settings saved');}else{state.settings.theme=v.theme;state.settings.textSize=v.textSize;state.settings.reducedMotion=v.reducedMotion==='on';await persist('Appearance saved');}render();}));}

    function privacySettings(){const recordCount=state.transactions.length+state.monthlyBudgets.length+state.terms.length+state.billDefinitions.length+state.subscriptionDefinitions.length+state.savingsGoals.length+state.sinkingFunds.length;return `<section class="card pad"><div class="cardhead"><div><h2>Privacy & Data</h2><p>Your financial records stay in this browser’s IndexedDB. There is no bank connection or cloud account.</p></div><span class="pill sage">${icon('shield')} Local only</span></div><div class="small-facts"><div><span>Transactions</span><strong>${state.transactions.length}</strong></div><div><span>Terms</span><strong>${state.terms.length}</strong></div><div><span>Goals / funds</span><strong>${state.savingsGoals.length+state.sinkingFunds.length}</strong></div></div><div class="data-actions"><button class="btn" data-action="backup">${icon('download')} Create backup</button><button class="btn" data-action="restore">${icon('upload')} Restore backup</button><button class="btn" data-action="export-transactions">${icon('download')} Transactions CSV</button><button class="btn" data-action="export-budget">${icon('download')} Budget CSV</button><button class="btn" data-action="export-semester">${icon('download')} Semester costs CSV</button><button class="btn" data-action="export-bills">${icon('download')} Bills CSV</button><button class="btn" data-action="export-savings">${icon('download')} Savings CSV</button></div><div style="margin-top:25px;padding-top:19px;border-top:1px solid var(--line)"><h3>Clear data</h3><p class="hint" style="margin-top:6px">Create a backup first. Clearing financial data preserves categories and preferences; deleting all app data resets everything.</p><div class="data-actions"><button class="btn danger" data-action="clear-financial">Clear financial data</button><button class="btn danger" data-action="clear-all">Delete all app data</button></div></div></section>`;}
    function securitySettings(){const enabled=state.settings.security.enabled;return `<section class="card pad"><div class="cardhead"><div><h2>Security</h2><p>A PIN locks the interface on this browser. It does not encrypt backups.</p></div><span class="pill ${enabled?'sage':'gold'}">${enabled?'PIN enabled':'PIN off'}</span></div><div class="setting-row"><div><h3>Protect this workspace</h3><p>Use 4–8 digits. The raw PIN is never stored.</p></div><button class="btn ${enabled?'danger':'primary'}" data-action="${enabled?'disable-pin':'enable-pin'}">${icon('lock')} ${enabled?'Disable PIN':'Enable PIN'}</button></div>${enabled?`<div class="data-actions"><button class="btn" data-action="lock-now">${icon('lock')} Lock now</button><button class="btn" data-action="change-pin">Change PIN</button><button class="btn" data-action="recovery-key">Generate recovery key</button></div>`:''}</section>`;}
    function helpSettings(){const topics=[['Start here','A calm first-use path for a new student.', ['Add your name, currency and language in General.','Create a monthly budget before recording spending.','Use Add quick for the action you need most often.']],['Dashboard','Your daily money command center.', ['Read the month snapshot first: received, spent, saved and remaining.','Recent expenses and Savings wins show the most useful latest activity.','Use the top-right bell for local reminders and Add quick for fast entry.']],['Budget','Plan spending without losing the real record.', ['Set a monthly total, then assign category budgets.','Essential and Flexible labels help you decide what can move.','Planned is your intention; actual is what you recorded.']],['Income & Expenses','Keep money in and money out clearly separated.', ['Add income when money is received. Add expenses when you spend.','Recurring income creates planned occurrences until they are recorded.','Transactions are the source used by reports and monthly totals.']],['Semester & Education Costs','Keep school costs separate from everyday living.', ['Create a term, add education costs and add funding plans.','Record a payment only when the cost is actually paid.','The education summary compares planned costs, paid costs and the remaining gap.']],['Bills & Subscriptions','Track repeating commitments safely.', ['Add a bill or subscription once and review its next due date.','Pay is available only in the lead window before the due date.','After payment, the current action is locked and the next opening date is shown. Pause stops future occurrences; End recurrence finishes the schedule.']],['Savings & Goals','Build progress with real contributions.', ['Create a goal for a target or a sinking fund for a known future cost.','Contribute when money is actually set aside.','Edit or delete a target from its card; progress uses recorded contributions.']],['Reports & Insights','Understand patterns before making a decision.', ['This month and last month use weekly periods. Longer views use monthly periods.','Spending by category ranks actual expenses.','Budget vs actual compares every planned category without a crowded chart.']],['Settings & Privacy','Tune the app while keeping your records local.', ['Language changes the interface to English, Spanish or French. English is the default.','Notification switches immediately hide matching local reminders.','Create a backup before clearing data. Restore accepts only a Student Budget Planner backup.']],['When something looks wrong','A quick troubleshooting checklist.', ['Refresh the page and confirm the selected month or report period.','Check Notifications if a reminder is missing or unwanted.','If a recurring item is already paid, wait for its next opening date.','This app is offline by design and notifications work while the app is open.']]];return `<section class='card pad'><div class='cardhead'><div><h2>Help & About</h2><p>Beginner-friendly explanations for the whole planner.</p></div></div><div class='help-grid'>${topics.map((x,i)=>'<details class=\'help-topic\' '+(i===0?'open':'')+'><summary>'+icon('info')+'<span><strong>'+x[0]+'</strong><small>'+x[1]+'</small></span></summary><div class=\'help-topic-body\'>'+x[2].map(s=>'<p>'+s+'</p>').join('')+'</div></details>').join('')}</div><div style='margin-top:19px;padding-top:19px;border-top:1px solid var(--line)'><p class='hint'>${APP_NAME}<br>Private local browser software. Notifications operate while the app is open.</p></div></section>`;}

    function formField(name,label,value='',type='text',extra='',hint=''){return `<div class="field"><label for="field-${name}">${label}</label><input id="field-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>${hint?`<span class="hint">${hint}</span>`:''}</div>`;}
    function selectField(name,label,options,value='',extra=''){return `<div class="field"><label for="field-${name}">${label}</label><select id="field-${name}" name="${name}" ${extra}>${options.map(o=>`<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;}
    function openModal(title,subtitle,body,onSubmit,submitLabel='Save'){modal={onSubmit};document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop open" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('close')}</button></div><div class="form-error" role="alert"></div><form id="active-form">${body}<div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn primary">${submitLabel}</button></div></form></section></div>`;localizeDom(document.getElementById('modal-root'));const form=document.getElementById('active-form');form?.addEventListener('submit',async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(form).entries());if(modal?.onSubmit)await modal.onSubmit(f);}catch(err){showError(err);}});setTimeout(()=>document.querySelector('#active-form input, #active-form select')?.focus(),80);}
    function closeModal(){modal=null;const root=document.getElementById('modal-root');if(root)root.innerHTML='';}
    function quickMenu(){
      const items=[['expense','Add expense','arrowDown'],['income','Add income','arrowUp'],['bill','Add bill','receipt'],['subscription','Add subscription','repeat'],['goal','Create savings goal','target']];
      const body='<p class="drawer-intro">Choose one of the actions students use most often.</p><div class="quick-groups"><section class="quick-group"><h3>Quick add</h3><div class="quick-actions">'+items.map(item=>'<button class="quick-action" data-action="quick-add" data-quick-kind="'+item[0]+'">'+icon(item[2])+'<span>'+item[1]+'</span></button>').join('')+'</div></section></div>';
      openDrawer('Add quick',body,'quick-drawer');
    }
    function quickAdd(kind){
      closeDrawer();
      if(kind==='expense')return showQuick('expense');
      if(kind==='income')return showQuick('income');
      if(kind==='recurring-income')return recurringIncomeForm();
      if(kind==='budget')return budgetForm();
      if(kind==='term')return termForm();
      if(kind==='education')return educationForm();
      if(kind==='funding')return fundingForm();
      if(kind==='bill')return commitmentForm('bill');
      if(kind==='subscription')return commitmentForm('subscription');
      if(kind==='goal')return targetForm('goal');
      if(kind==='fund')return targetForm('fund');
      if(kind==='contribution')return contributeForm();
    }
    function openDrawer(title,body,kind=''){drawer=true;document.getElementById('drawer-root').innerHTML=`<div class="drawer-backdrop open${kind?' '+kind:''}" data-drawer-backdrop><section class="drawer" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>${title}</h2></div><button class="modal-close" data-action="close-drawer" aria-label="Close">${icon('close')}</button></div>${body}</section></div>`;localizeDom(document.getElementById('drawer-root'));}
    function closeDrawer(){drawer=null;const root=document.getElementById('drawer-root');if(root)root.innerHTML='';}

    function quickForm(type='expense',editing=null){const initial=editing||{};const date=initial.date||today();const expenseOpts=expenseCategories().map(c=>[c.id,c.name]);const incomeOpts=incomeCategories().map(c=>[c.id,c.name]);const details=`<details style="margin-top:16px"><summary class="linkbtn">More details</summary><div class="form-grid" style="margin-top:15px">${type==='expense'?formField('name','Merchant / description',initial.name||'','text','maxlength="80" placeholder="Campus café"'):''}${formField('method','Payment method',initial.method||'','text','maxlength="40" placeholder="Debit card"')}${type==='expense'?selectField('termId','Semester / term',[['','Not linked'],...state.terms.map(t=>[t.id,t.name])],initial.termId||''):''}${formField('notes','Notes',initial.note||'','text','maxlength="180" placeholder="Optional note"')}</div></details>`;if(type==='income')return `<div class="form-grid">${formField('amount','Amount*',inputMoney(initial.amount),'number','required min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"')}${formField('date','Date*',date,'date','required')}${formField('name','Source*',initial.name||'','text','required maxlength="80" placeholder="Part-time job"')}${selectField('categoryId','Funding source*',incomeOpts, initial.categoryId||incomeOpts[0]?.[0]||'')}${selectField('fundingType','Funding type',[['Earned','Earned'],['Support / Aid','Support / Aid'],['Borrowed','Borrowed']],initial.fundingType||'Earned')}${details}</div>`;return `<div class="form-grid">${formField('amount','Amount*',inputMoney(initial.amount),'number','required min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"')}${selectField('categoryId','Category*',expenseOpts,initial.categoryId||expenseOpts.find(x=>x[1]==='Other')?.[0]||expenseOpts[0]?.[0]||'')}${formField('date','Date*',date,'date','required')}${details}</div>`;}
    function showQuick(type='expense',editing=null){const isIncome=type==='income';openModal(editing?(isIncome?'Edit income':'Edit expense'):(isIncome?'Add income':'Add expense'),isIncome?'Record confirmed money received.':'Log a daily expense in a few seconds.',quickForm(type,editing),async f=>{const amount=cents(f.amount);if(amount<=0)throw Error('Enter an amount greater than zero.');const date=dateOnly(f.date)||today();if(isIncome){const t={id:editing?.id||uid('tx'),type:'income',amount,date,name:f.name.trim(),categoryId:f.categoryId,fundingType:f.fundingType||'Earned',note:f.notes||'',method:f.method||'',termId:f.termId||''};if(!t.name)throw Error('Add a source so you know where the money came from.');if(editing){replaceTransaction(editing.id,t);}else{state.transactions.push(t);state.incomeRecords.push({id:t.id,...t});}}else{const t={id:editing?.id||uid('tx'),type:'expense',amount,date,name:(f.name||category(f.categoryId).name).trim(),categoryId:f.categoryId,note:f.notes||'',method:f.method||'',termId:f.termId||''};if(editing)replaceTransaction(editing.id,t);else{state.transactions.push(t);state.expenseRecords.push({id:t.id,...t});} }syncNotifications();await Storage.save(state);closeModal();render();toast(editing?'Entry updated':'Entry saved');});}
    function replaceTransaction(id,next){const idx=state.transactions.findIndex(x=>x.id===id);if(idx<0)throw Error('This record no longer exists.');state.transactions[idx]=next;const er=state.expenseRecords.findIndex(x=>x.id===id);if(er>=0){if(isActualExpense(next))state.expenseRecords[er]={id:next.id,...next};else state.expenseRecords.splice(er,1);}const ir=state.incomeRecords.findIndex(x=>x.id===id);if(ir>=0){if(isActualIncome(next))state.incomeRecords[ir]={id:next.id,...next};else state.incomeRecords.splice(ir,1);}}

    function budgetForm(id=''){const b=budget(selectedMonth);const old=allocations(selectedMonth).find(x=>x.id===id);openModal(old?'Edit category allocation':'Set monthly budget','Planned amounts stay separate from actual spending.',old?`${formField('amount','Planned amount*',inputMoney(old.plannedCents),'number','required min="0" step="0.01"')} ${selectField('type','Category type',[['Essential','Essential'],['Flexible','Flexible']],old.type)}`:`${formField('total','Monthly spending budget*',inputMoney(b.plannedCents),'number','required min="0" step="0.01"')}${formField('savings','Planned savings',inputMoney(b.plannedSavingsCents),'number','min="0" step="0.01"')}`,async f=>{if(old){old.plannedCents=cents(f.amount);old.type=f.type;await Storage.save(state);closeModal();render();toast('Budget allocation updated');return;}const total=cents(f.total),saving=cents(f.savings);if(total<0)throw Error('Enter a valid monthly budget.');let existing=state.monthlyBudgets.find(x=>x.month===selectedMonth);if(!existing)state.monthlyBudgets.push(existing={month:selectedMonth,plannedCents:total,plannedSavingsCents:saving,alertThresholds:[80,90,100]});else{existing.plannedCents=total;existing.plannedSavingsCents=saving;}closeModal();render();toast('Monthly budget saved');});}
    function allocationForm(id=''){const old=allocations(selectedMonth).find(x=>x.id===id);const available=expenseCategories().filter(c=>c.id===old?.categoryId||!allocations(selectedMonth).some(a=>a.categoryId===c.id));const options=old?[[old.categoryId,category(old.categoryId).name],...available.filter(c=>c.id!==old.categoryId).map(c=>[c.id,c.name])]:available.map(c=>[c.id,c.name]);if(!old&&!available.length){toast('All expense categories are already allocated for this month.');return;}const defaultType=old?.type||((available[0]?.group==='Essential')?'Essential':'Flexible');openModal(old?'Edit category allocation':'Add category to budget','Choose Essential or Flexible for a clearer monthly plan.',`${selectField('categoryId','Category*',options,old?.categoryId||available[0]?.id||'')}${formField('amount','Planned amount*',inputMoney(old?.plannedCents||0),'number','required min="0.01" step="0.01"')}${selectField('type','Category type',[['Essential','Essential'],['Flexible','Flexible']],defaultType)}`,async f=>{const amount=cents(f.amount);if(!f.categoryId)throw Error('Choose a category.');if(!f.type)throw Error('Choose Essential or Flexible.');if(amount<=0)throw Error('Enter a planned amount greater than zero.');const duplicate=allocations(selectedMonth).some(a=>a.categoryId===f.categoryId&&a.id!==id);if(duplicate)throw Error('That category is already in this month’s budget.');const a={id:old?.id||uid('alloc'),month:selectedMonth,categoryId:f.categoryId,plannedCents:amount,type:f.type};if(old)Object.assign(old,a);else state.budgetAllocations.push(a);await Storage.save(state);closeModal();render();toast(old?'Allocation updated':'Category added to budget');});}
    function copyMonthForm(){const months=state.monthlyBudgets.map(x=>x.month).filter(x=>x!==selectedMonth).sort().reverse();openModal('Copy previous month','This copies allocations and planned savings only. Actual records stay untouched.',`${selectField('source','Copy from',months.length?months.map(m=>[m,monthFmt(m)]):[[addMonths(selectedMonth,-1),monthFmt(addMonths(selectedMonth,-1))]],months[0]||addMonths(selectedMonth,-1))}<label class="checkrow" style="margin-top:14px"><input type="checkbox" name="replace"> Replace existing allocations for ${monthFmt(selectedMonth)}</label>`,async f=>{const src=f.source;const sb=budget(src),sa=allocations(src);let dest=state.monthlyBudgets.find(x=>x.month===selectedMonth);if(!dest)state.monthlyBudgets.push(dest={month:selectedMonth,plannedCents:sb.plannedCents||sa.reduce((s,x)=>s+x.plannedCents,0),plannedSavingsCents:sb.plannedSavingsCents||0,alertThresholds:[80,90,100]});else{dest.plannedCents=sb.plannedCents;dest.plannedSavingsCents=sb.plannedSavingsCents;}if(f.replace)state.budgetAllocations=state.budgetAllocations.filter(x=>x.month!==selectedMonth);for(const a of sa){if(!state.budgetAllocations.some(x=>x.month===selectedMonth&&x.categoryId===a.categoryId))state.budgetAllocations.push({...a,id:uid('alloc'),month:selectedMonth});}closeModal();render();toast('Previous month budget copied');});}

    function incomeForm(){showQuick('income');}
    function termForm(id=''){const old=term(id),initial=old||{type:'Semester',name:'',startDate:today(),endDate:addDays(today(),120)};openModal(old?'Edit term':'Add semester / term','Historical terms remain preserved.',`${selectField('type','Term type',[['Semester','Semester'],['Quarter','Quarter'],['Trimester','Trimester'],['Custom','Custom term']],initial.type)}${formField('name','Term name*',initial.name,'text','required maxlength="80" placeholder="Fall 2026"')}${formField('startDate','Start date*',initial.startDate,'date','required')}${formField('endDate','End date*',initial.endDate,'date','required')}`,async f=>{if(!f.name.trim())throw Error('Add a name for this term.');if(f.endDate<f.startDate)throw Error('End date must be after start date.');const t={id:old?.id||uid('term'),type:f.type,name:f.name.trim(),startDate:dateOnly(f.startDate),endDate:dateOnly(f.endDate),status:'active'};if(old)Object.assign(old,t);else state.terms.push(t);if(!state.settings.currentTermId)state.settings.currentTermId=t.id;await Storage.save(state);closeModal();render();toast(old?'Term updated':'Term added');});}
    function educationForm(id='',termId=''){const old=state.educationCostItems.find(x=>x.id===id),initial=old||{termId:termId||state.settings.currentTermId||state.terms[0]?.id||'',category:'Tuition',name:'',plannedCents:0,dueDate:'',notes:''};const cats=['Tuition','School / University Fees','Books','Textbooks','Course Materials','Lab Fees','Exam Fees','Equipment','Laptop / Technology','Printing','Supplies / Stationery','Transportation / Campus Pass','Accommodation / Dorm Fees','Meal Plan','Study Trip','Graduation Costs','Other Education Costs'];openModal(old?'Edit education cost':'Add education cost','A planned cost does not create an expense until you record payment.',`${formField('name','Cost name*',initial.name,'text','required maxlength="80" placeholder="Fall tuition"')}${selectField('category','Category*',cats.map(x=>[x,x]),initial.category)}${selectField('termId','Term*',state.terms.map(t=>[t.id,t.name]),initial.termId)}${formField('planned','Planned amount*',inputMoney(initial.plannedCents),'number','required min="0" step="0.01"')}${formField('dueDate','Due date',initial.dueDate,'date')}${formField('notes','Notes','', 'text','maxlength="180" placeholder="Optional"')}`,async f=>{if(!state.terms.length)throw Error('Add a term before adding education costs.');const item={id:old?.id||uid('edu'),name:f.name.trim(),category:f.category,termId:f.termId,plannedCents:cents(f.planned),dueDate:dateOnly(f.dueDate),notes:f.notes||''};if(!item.name||item.plannedCents<=0)throw Error('Add a name and planned amount greater than zero.');if(old)Object.assign(old,item);else state.educationCostItems.push(item);await Storage.save(state);closeModal();render();toast(old?'Education cost updated':'Education cost added');});}
    function recordEducationForm(id){const item=state.educationCostItems.find(x=>x.id===id);if(!item)return;const paid=itemPaid(item);openModal('Record education cost payment',`${item.name} · planned ${money(item.plannedCents)} · paid ${money(paid)}`,`${formField('amount','Actual amount*',inputMoney(Math.max(0,item.plannedCents-paid)),'number','required min="0.01" step="0.01"')}${formField('date','Payment date*',today(),'date','required')}${formField('name','Description',item.name,'text','maxlength="80"')}${formField('notes','Notes','','text','maxlength="180"')}`,async f=>{const amount=cents(f.amount);if(amount<=0)throw Error('Enter an amount greater than zero.');const t={id:uid('tx'),type:'educationPayment',amount,date:dateOnly(f.date)||today(),name:f.name||item.name,categoryId:state.categories.find(c=>c.name===item.category)?.id||state.categories.find(c=>c.name==='Tuition')?.id,sourceEducationCostItemId:item.id,termId:item.termId,note:f.notes||''};state.transactions.push(t);state.expenseRecords.push({id:t.id,...t});syncNotifications();await Storage.save(state);closeModal();render();toast('Education payment recorded once');});}
    function fundingForm(id=''){const old=state.termFundingPlans.find(x=>x.id===id),current=currentTerm();if(!current){toast('Add a current term first.');return;}const initial=old||{termId:current.id,type:'Scholarship',name:'',plannedCents:0,receivedCents:0};openModal(old?'Edit funding plan':'Add planned funding','Planned funding is separate from funding you have actually received. Use Receive when the money arrives so Dashboard and Reports stay connected.',`${formField('name','Funding name*',initial.name,'text','required maxlength="80" placeholder="Fall scholarship"')}${selectField('type','Funding type',[['Scholarship','Scholarship'],['Grant','Grant'],['Student Loan','Student Loan'],['Family Support','Family Support'],['Work Income','Work Income'],['Savings','Savings'],['Other','Other']],initial.type)}${formField('planned','Planned amount*',inputMoney(initial.plannedCents),'number','required min="0" step="0.01"')}`,async f=>{const p={id:old?.id||uid('funding'),termId:current.id,name:f.name.trim(),type:f.type,plannedCents:cents(f.planned),receivedCents:old?.receivedCents||0};if(!p.name||p.plannedCents<0)throw Error('Add a funding name and valid amount.');if(old)Object.assign(old,p);else state.termFundingPlans.push(p);await Storage.save(state);closeModal();render();toast(old?'Funding plan updated':'Funding plan added');});}
