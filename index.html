    function syncNotifications(){
      const n=state.settings.notifications||{},now=today();
      state.notifications=state.notifications.filter(item=>notificationAllowed(item.type)&&(!item.dismissed||Date.now()-new Date(item.createdAt).getTime()<90*86400000));
      const existing=new Set(state.notifications.map(item=>item.key));
      const add=(key,type,title,body,date=now)=>{if(!existing.has(key)){state.notifications.push({id:uid('notice'),key,type,title,body,date,createdAt:new Date().toISOString(),read:false,dismissed:false});existing.add(key);}};
      if(n.master){
        for(const a of allocations(selectedMonth)){const actual=actualCategory(selectedMonth,a.categoryId),pct=a.plannedCents?actual/a.plannedCents*100:0;for(const th of state.settings.budgetThresholds){if(pct>=th)add('budget-'+selectedMonth+'-'+a.categoryId+'-'+th,'Budget threshold',category(a.categoryId).name+' is at '+th+'%',money(actual)+' spent of '+money(a.plannedCents)+' planned in '+monthFmt(selectedMonth)+'.');}}
        if(n.bill)for(const o of state.billOccurrences.filter(x=>x.status!=='paid')){const item=state.billDefinitions.find(b=>b.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('bill-'+o.id+'-'+stage,'Bill reminder',(o.name||'Bill')+' needs attention',stage==='overdue'?'Overdue · '+dateFmt(o.dueDate)+'.':stage==='due'?'Due today · '+dateFmt(o.dueDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.dueDate)+'.');}
        if(n.subscription)for(const o of state.subscriptionCycles.filter(x=>x.status!=='paid'&&!x.isTrial)){const item=state.subscriptionDefinitions.find(s=>s.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('sub-'+o.id+'-'+stage,'Subscription reminder',(o.name||'Subscription')+' is renewing',stage==='overdue'?'Overdue · '+dateFmt(o.billingDate)+'.':stage==='due'?'Due today · '+dateFmt(o.billingDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.billingDate)+'.');}
        if(n.trial)for(const o of state.subscriptionCycles.filter(x=>x.isTrial&&x.status!=='paid'&&x.billingDate<=addDays(now,5)))add('trial-'+o.id,'Trial ending',(o.name||'Trial')+' is ending',dateFmt(o.billingDate)+' · first paid billing follows.');
        if(n.education)for(const c of state.educationCostItems.filter(x=>x.dueDate&&x.dueDate<=addDays(now,7)&&itemPaid(x)<x.plannedCents))add('edu-'+c.id,'Education cost due',c.name+' is coming up',dateFmt(c.dueDate)+' · '+money(c.plannedCents-itemPaid(c))+' remaining.');
        for(const g of [...state.savingsGoals,...state.sinkingFunds]){const pct=g.targetCents?goalSaved(g)/g.targetCents*100:0;for(const th of [25,50,75,100])if(pct>=th)add('goal-'+g.id+'-'+th,'Goal milestone',g.name+' reached '+th+'%',money(goalSaved(g))+' saved toward '+money(g.targetCents)+'.');}
      }
    }

    function download(name,content,type='application/json'){const blob=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);}
    function backup(){const backupData=JSON.parse(JSON.stringify(state));backupData.settings=Object.assign({},backupData.settings,{security:{enabled:false,hash:'',salt:'',recoveryHash:'',attempts:0}});const payload={schemaVersion:1,appName:APP_NAME,createdAt:new Date().toISOString(),data:backupData};download(`Student-Budget-Planner-Backup-${today()}.json`,JSON.stringify(payload,null,2));state.settings.lastBackup=today();persist();toast('Backup download created');}
    function csvEscape(value){let s=String(value??'');if(/^[=+@\-\t\r]/.test(s)&&!/^[+-]?[0-9.]+$/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`;}
    function exportCSV(kind){let rows=[];if(kind==='transactions'){rows=[['Date','Type','Description','Category','Amount','Term','Funding Type','Notes'],...state.transactions.map(t=>[t.date,txLabel(t.type),t.name,t.categoryId?category(t.categoryId).name:'',number(t.amount),t.termId?term(t.termId)?.name||'':'',t.fundingType||'',t.note||''])];download(`Student-Budget-Planner-Transactions-${today()}.csv`,rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');}else if(kind==='budget'){rows=[['Month','Category','Planned','Actual','Remaining','Type'],...state.budgetAllocations.map(a=>[a.month,category(a.categoryId).name,number(a.plannedCents),number(actualCategory(a.month,a.categoryId)),number(a.plannedCents-actualCategory(a.month,a.categoryId)),a.type])];download(`Student-Budget-Planner-Budget-${today()}.csv`,rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');}else if(kind==='semester'){rows=[['Term','Cost Item','Category','Planned','Actual Paid','Remaining','Due Date'],...state.educationCostItems.map(c=>[term(c.termId)?.name||'',c.name,c.category,number(c.plannedCents),number(itemPaid(c)),number(c.plannedCents-itemPaid(c)),c.dueDate])];download(`Student-Budget-Planner-Semester-Costs-${today()}.csv`,rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');}else if(kind==='bills'){rows=[['Name','Expected Amount','Frequency','Due Date','Status','Paid Occurrences'],...state.billDefinitions.map(b=>[b.name,number(b.amountCents),b.frequency,b.date,b.status,state.billOccurrences.filter(o=>o.definitionId===b.id&&o.status==='paid').length])];download(`Student-Budget-Planner-Bills-${today()}.csv`,rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');}else{rows=[['Target','Type','Target Amount','Saved','Remaining','Target Date'],...[...state.savingsGoals,...state.sinkingFunds].map(g=>[g.name,g.kind==='fund'?'Sinking Fund':'Goal',number(g.targetCents),number(goalSaved(g)),number(Math.max(0,g.targetCents-goalSaved(g))),g.targetDate])];download(`Student-Budget-Planner-Savings-${today()}.csv`,rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');}toast('CSV download created');}
    function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);if(payload.appName!==APP_NAME||!payload.data||payload.schemaVersion!==1)throw Error('This backup does not belong to Student Budget Planner.');const raw=payload.data;if(!Array.isArray(raw.transactions)||!Array.isArray(raw.categories)||!Array.isArray(raw.monthlyBudgets))throw Error('The backup structure is not valid.');const next=normalizedCopy(raw),currentSecurity=JSON.parse(JSON.stringify(state.settings.security||{}));openModal('Restore this backup?','Current data will be replaced after you confirm. Create a backup first if you need it.',`<p class="confirm-text">This backup contains ${next.transactions.length} transactions, ${next.terms.length} terms, ${next.educationCostItems.length} education costs and ${next.savingsGoals.length+next.sinkingFunds.length} goals or funds.</p><div class="field" style="margin-top:15px"><label>Type RESTORE to continue</label><input name="confirmation" required autocomplete="off"></div>`,async f=>{if(f.confirmation!=='RESTORE')throw Error('Type RESTORE exactly to continue.');state=next;state.settings.security=currentSecurity;await Storage.save(state);closeModal();render();toast('Backup restored safely');});}catch(e){showError(e);}};reader.readAsText(file);};input.click();}
    function clearData(all){openModal(all?'Delete all app data?':'Clear financial data?',all?'This resets all records, categories, preferences and PIN.':'This removes financial records but keeps your categories, preferences and PIN.',`<p class="confirm-text">This action cannot be undone unless you have a backup.</p><div class="field" style="margin-top:15px"><label>Type DELETE to continue</label><input name="confirmation" required autocomplete="off"></div>`,async f=>{if(f.confirmation!=='DELETE')throw Error('Type DELETE exactly to continue.');if(all){state=defaults();await Storage.save(state);}else{const keep={categories:state.categories,settings:state.settings};state=defaults();state.categories=keep.categories;state.settings=keep.settings;await Storage.save(state);}closeModal();render();toast(all?'All app data deleted':'Financial data cleared');});}

    function pinModal(mode){const enabled=state.settings.security.enabled;if(mode==='disable'&&!enabled)return;const title=mode==='enable'?'Enable PIN':mode==='change'?'Change PIN':mode==='recovery'?'Generate recovery key':'Disable PIN';openModal(title,'The raw PIN is never stored.',`${mode!=='enable'?formField('current','Current PIN*','','password','required inputmode="numeric" maxlength="8" autocomplete="off"'):''}${mode!=='recovery'&&mode!=='disable'?formField('pin','New PIN*','','password','required inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password"')+formField('confirm','Confirm PIN*','','password','required inputmode="numeric" maxlength="8" autocomplete="new-password"'):''}`,async f=>{if(mode!=='enable'&&!(await verifyPin(f.current)))throw Error('That PIN is not correct.');if(mode==='disable'){state.settings.security={enabled:false,hash:'',salt:'',recoveryHash:'',attempts:0};}else if(mode==='recovery'){const key=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,'0')).join('').match(/.{1,4}/g).join('-');const sec=state.settings.security;sec.recoveryHash=await hashSecret(key,sec.salt);openModal('Save your recovery key','This key can unlock the workspace if you forget the PIN.',`<p class="confirm-text">Keep this key somewhere private. It will not be shown again.</p><div class="card" style="padding:14px;margin-top:15px;font-weight:800;letter-spacing:.12em;text-align:center">${key}</div>`,async()=>{await Storage.save(state);sessionStorage.setItem('sbp-unlocked','yes');closeModal();render();toast('Recovery key saved');},'I saved it');return;}else{const pin=f.pin;if(!/^\d{4,8}$/.test(pin))throw Error('Use 4–8 digits.');const salt=randomSalt();state.settings.security={enabled:true,salt,hash:await hashSecret(pin,salt),recoveryHash:'',attempts:0};}await Storage.save(state);sessionStorage.setItem('sbp-unlocked','yes');closeModal();render();toast(mode==='disable'?'PIN disabled':'PIN settings updated');});}
    function lockNow(){pinLock=true;render();}
    function lockScreen(){return `<main class="lock-screen"><section class="card lock-card"><div class="brandmark">${icon('lock')}</div><div class="eyebrow">${APP_NAME}</div><h1 style="margin-top:10px">Your private workspace.</h1><p>Enter your PIN to pick up where you left off.</p><form data-form="unlock"><div class="form-error" role="alert"></div>${formField('pin','PIN','','password','required inputmode="numeric" maxlength="8" autocomplete="off"')}<div class="form-actions"><button class="btn primary" type="submit">${icon('lock')} Unlock workspace</button></div></form><button class="linkbtn" style="margin-top:18px" data-action="use-recovery">Use recovery key</button></section></main>`;}
    function recoveryScreen(){return `<main class="lock-screen"><section class="card lock-card"><div class="brandmark">${icon('shield')}</div><div class="eyebrow">Recovery</div><h1 style="margin-top:10px">Unlock with recovery key</h1><p>Use the key you saved when PIN protection was enabled.</p><form data-form="recovery"><div class="form-error" role="alert"></div>${formField('key','Recovery key','','text','required autocomplete="off"')}<div class="form-actions"><button class="btn primary" type="submit">Unlock workspace</button></div></form><button class="linkbtn" style="margin-top:18px" data-action="use-pin">Use PIN instead</button></section></main>`;}

    function applyPreferences(){const theme=state.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.settings.theme;document.documentElement.dataset.theme=theme;document.documentElement.style.setProperty('--scale',{small:.92,medium:1,large:1.08,'extra-large':1.16}[state.settings.textSize]||1);document.body.classList.toggle('reduced-motion',!!state.settings.reducedMotion);}
    function render(){if(!state)return;applyPreferences();if(pinLock||state.settings.security.enabled&&sessionStorage.getItem('sbp-unlocked')!=='yes'){pinLock=true;document.body.innerHTML=state.settings.security.recoveryMode?recoveryScreen():lockScreen();localizeDom();return;}document.body.innerHTML=shell(page==='dashboard'?dashboard():page==='budget'?budgetPage():page==='income-expenses'?incomeExpensesPage():page==='semester'?semesterPage():page==='bills'?billsPage():page==='savings'?savingsPage():page==='reports'?reportsPage():settingsPage());reorderDashboardCards();enhanceDashboardHero();enhanceDashboardRecent();enhanceNavigationBrand();enhanceTopbar();enhanceBudgetPage();enhanceBudgetControls();bindGlobal();localizeDom();if(activeFilterId){const field=document.getElementById(activeFilterId);if(field){field.focus({preventScroll:true});if(activeFilterId==='tx-search'&&typeof activeFilterCaret==='number')field.setSelectionRange(activeFilterCaret,activeFilterCaret);}}activeFilterId='';}
    function navigate(next){if(!navItems().some(x=>x[0]===next))return;page=next;activeTab[next]=activeTab[next]||({ 'income-expenses':'income','semester':'plan','bills':'bills','savings':'goals'}[next]||'');closeDrawer();render();}
    function bindGlobal(){document.querySelectorAll('.navitem[data-page], .mobile-bottom [data-action="navigate"][data-page]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();navigate(el.dataset.page);}));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('input',()=>{if(page==='income-expenses'&&activeTab['income-expenses']==='transactions')render();}));document.querySelector('[data-period]')?.addEventListener('change',render);document.querySelector('[data-setting="currentTerm"]')?.addEventListener('change',async e=>{state.settings.currentTermId=e.target.value;await persist();render();});document.querySelectorAll('[data-threshold]').forEach(el=>el.addEventListener('change',async e=>{const n=Number(e.target.dataset.threshold);state.settings.budgetThresholds=e.target.checked?[...new Set([...state.settings.budgetThresholds,n])].sort((a,b)=>a-b):state.settings.budgetThresholds.filter(x=>x!==n);await persist();render();}));document.querySelectorAll('[data-notification]').forEach(el=>el.addEventListener('change',async e=>{state.settings.notifications[e.target.dataset.notification]=e.target.checked;syncNotifications();await persist();render();}));const form=document.getElementById('active-form');if(form)form.addEventListener('submit',async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(form).entries());if(modal?.onSubmit)await modal.onSubmit(f);}catch(err){showError(err);}});document.querySelectorAll('[data-form="general"], [data-form="appearance"]').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f).entries());if(f.dataset.form==='general'){state.settings.name=v.name.trim();state.settings.currency=v.currency;state.settings.language=v.language||'en';await persist('General settings saved');}else{state.settings.theme=v.theme;state.settings.textSize=v.textSize;state.settings.reducedMotion=v.reducedMotion==='on';await persist('Appearance saved');}render();}));document.querySelectorAll('[data-backdrop]').forEach(e=>e.addEventListener('click',x=>{if(x.target===e)closeModal();}));document.querySelectorAll('[data-drawer-backdrop]').forEach(e=>e.addEventListener('click',x=>{if(x.target===e)closeDrawer();}));}

    async function handleAction(el){const act=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;
      if(act==='reset-demo')return resetDemo();
      if(['backup','restore','clear-financial','clear-all','enable-pin','disable-pin','change-pin','recovery-key','lock-now'].includes(act))return demoUnavailable();
      if(act==='recovery-key')return pinModalWithRecoveryDownload();
      if(act==='download-recovery-key')return downloadRecoveryKey(el.dataset.recoveryKey);
      if(act==='navigate')return navigate(el.dataset.page);
      if(act==='open-nav')return navDrawer();
      if(act==='close-modal')return closeModal();if(act==='close-drawer')return closeDrawer();
      if(act==='quick')return showQuick(el.dataset.quickType||'expense');if(act==='notifications')return notificationsDrawer();if(act==='toggle-theme'){const active=state.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.settings.theme;state.settings.theme=active==='dark'?'light':'dark';await persist();render();toast(state.settings.theme==='dark'?'Dark theme enabled':'Light theme enabled');return;}
      if(act==='new-budget')return budgetForm();if(act==='copy-month')return copyMonthForm();if(act==='new-allocation')return allocationForm();if(act==='edit-allocation')return allocationForm(id);if(act==='delete-allocation')return deleteAllocation(id);if(act==='prev-month'){selectedMonth=addMonths(selectedMonth,-1);return render();}if(act==='next-month'){selectedMonth=addMonths(selectedMonth,1);return render();}if(act==='current-month'){selectedMonth=monthOf(today());return render();}
      if(act==='subtab'){activeTab[el.dataset.page]=el.dataset.tab;if(el.dataset.page==='income-expenses'&&el.dataset.tab!=='transactions')transactionHistoryExpanded=false;return render();}if(act==='show-full-history'){transactionHistoryExpanded=true;return render();}if(act==='show-recent-transactions'){transactionHistoryExpanded=false;return render();}if(act==='show-full-expenses'){expenseHistoryExpanded=true;return render();}if(act==='show-recent-expenses'){expenseHistoryExpanded=false;return render();}if(act==='show-full-contributions'){contributionHistoryExpanded=true;return render();}if(act==='show-recent-contributions'){contributionHistoryExpanded=false;return render();}
      if(act==='new-income')return incomeForm();if(act==='new-recurring-income')return recurringIncomeForm();if(act==='receive-recurring')return receiveRecurringIncome(id);if(act==='edit-transaction'){const t=state.transactions.find(x=>x.id===id);if(!t)return;return showQuick(t.type==='income'?'income':'expense',t);}if(act==='delete-transaction')return deleteTransaction(id);
      if(act==='new-term')return termForm();if(act==='edit-term')return termForm(id);if(act==='set-current-term'){state.settings.currentTermId=id;await persist();render();toast('Current term updated');return;}if(act==='new-education')return educationForm('',el.dataset.termId||'');if(act==='edit-education')return educationForm(id);if(act==='record-education')return recordEducationForm(id);if(act==='new-funding')return fundingForm();if(act==='edit-funding')return fundingForm(id);if(act==='receive-funding')return receiveFunding(id);
      if(act==='commitment-more')return commitmentMore(kind,id);if(act==='payment-history'){closeDrawer();closeModal();return paymentHistory(kind,id);}if(act==='new-bill')return commitmentForm('bill');if(act==='new-subscription')return commitmentForm('subscription');if(act==='edit-commitment'){closeDrawer();closeModal();return commitmentForm(kind,id);}if(act==='pay-commitment'){closeDrawer();return paymentForm(kind,id,el.dataset.occurrence);}if(act==='pause-commitment'){closeDrawer();closeModal();return pauseCommitment(kind,id);}if(act==='end-commitment'){closeDrawer();closeModal();return endCommitment(kind,id);}if(act==='delete-commitment'){closeDrawer();closeModal();return deleteCommitment(kind,id);}if(act==='day-agenda')return dayAgenda(el.dataset.date);
      if(act==='new-goal')return targetForm('goal');if(act==='new-fund')return targetForm('fund');if(act==='edit-target')return targetForm((state.savingsGoals.find(x=>x.id===id)?'goal':'fund'),id);if(act==='delete-target')return deleteTarget(id);if(act==='contribute')return contributeForm(id);if(act==='new-contribution')return contributeForm();if(act==='edit-contribution')return editContributionForm(id);if(act==='delete-contribution')return deleteContribution(id);
      if(act==='settings-section'){settingsSection=el.dataset.section;const host=document.querySelector('.settings-layout>div');if(page==='settings'&&host){document.querySelectorAll('.settings-nav [data-section]').forEach(btn=>btn.classList.toggle('active',btn.dataset.section===settingsSection));host.innerHTML=settingsSectionMarkup();localizeDom(host);bindSettingsContent(host);return;}return render();}
      if(act==='settings-section'){const scrollY=window.scrollY||0;settingsSection=el.dataset.section;render();if(typeof window.scrollTo==='function')window.scrollTo(0,scrollY);return;}if(act==='navigate-settings-notifications'){closeDrawer();page='settings';settingsSection='notifications';return render();}if(act==='backup')return backup();if(act==='restore')return restore();if(act.startsWith('export-'))return exportCSV(act.slice(7));if(act==='clear-financial')return clearData(false);if(act==='clear-all')return clearData(true);if(act==='new-category')return categoryForm();if(act==='edit-category')return categoryForm(id);if(act==='toggle-category'){const c=state.categories.find(x=>x.id===id);if(c){c.archived=!c.archived;await persist();render();toast(c.archived?'Category archived':'Category restored');}return;}if(act==='enable-pin')return pinModal('enable');if(act==='disable-pin')return pinModal('disable');if(act==='change-pin')return pinModal('change');if(act==='recovery-key')return pinModal('recovery');if(act==='lock-now')return lockNow();if(act==='mark-all-read'){state.notifications.forEach(n=>{n.read=true});await persist();notificationsDrawer();return;}if(act==='read-notification'){const n=state.notifications.find(x=>x.id===id);if(n)n.read=true;await persist();notificationsDrawer();return;}if(act==='dismiss-notification'){const n=state.notifications.find(x=>x.id===id);if(n)n.dismissed=true;await persist();notificationsDrawer();return;}if(act==='use-recovery'){state.settings.security.recoveryMode=true;render();return;}if(act==='use-pin'){state.settings.security.recoveryMode=false;render();return;}
    }
    async function deleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;openModal('Delete this record?','This reverses only this one financial effect.',`<p class="confirm-text">${esc(t.name||txLabel(t.type))} · ${money(t.amount)} on ${dateFmt(t.date)}</p><div class="field" style="margin-top:15px"><label>Type DELETE to continue</label><input name="confirmation" required autocomplete="off"></div>`,async f=>{if(f.confirmation!=='DELETE')throw Error('Type DELETE exactly to continue.');state.transactions=state.transactions.filter(x=>x.id!==id);state.expenseRecords=state.expenseRecords.filter(x=>x.id!==id);state.incomeRecords=state.incomeRecords.filter(x=>x.id!==id);if(t.type==='savingsContribution')state.savingsContributions=state.savingsContributions.filter(x=>x.id!==t.contributionId);if(t.sourceBillOccurrenceId){const o=state.billOccurrences.find(x=>x.id===t.sourceBillOccurrenceId);if(o){o.status='unpaid';delete o.paymentDate;delete o.actualAmount;}}if(t.sourceSubscriptionCycleId){const o=state.subscriptionCycles.find(x=>x.id===t.sourceSubscriptionCycleId);if(o){o.status='unpaid';delete o.paymentDate;delete o.actualAmount;}}syncNotifications();await Storage.save(state);closeModal();render();toast('Record deleted and totals updated');});}

    function notificationAllowed(type,stage){const n=state.settings.notifications||{},map={'Bill reminder':'bill','Subscription reminder':'subscription','Trial ending':'trial','Education cost due':'education'};if(!n.master)return false;const key=map[type];if(key&&n[key]===false)return false;if(stage&&key==='bill'&&n.billStages?.[stage]===false)return false;if(stage&&key==='subscription'&&n.subscriptionStages?.[stage]===false)return false;return true;}
    function syncNotifications(){const n=state.settings.notifications||{},now=today();state.notifications=state.notifications.filter(item=>notificationAllowed(item.type,item.stage)&&(!item.dismissed||Date.now()-new Date(item.createdAt).getTime()<90*86400000));const existing=new Set(state.notifications.map(item=>item.key));const add=(key,type,title,body,date=now,stage='')=>{if(!notificationAllowed(type,stage)||existing.has(key))return;state.notifications.push({id:uid('notice'),key,type,stage,title,body,date,createdAt:new Date().toISOString(),read:false,dismissed:false});existing.add(key);};if(!n.master)return;for(const a of allocations(selectedMonth)){const actual=actualCategory(selectedMonth,a.categoryId),pct=a.plannedCents?actual/a.plannedCents*100:0;for(const th of state.settings.budgetThresholds){if(pct>=th)add('budget-'+selectedMonth+'-'+a.categoryId+'-'+th,'Budget threshold',category(a.categoryId).name+' is at '+th+'%',money(actual)+' spent of '+money(a.plannedCents)+' planned in '+monthFmt(selectedMonth)+'.');}}if(n.bill!==false)for(const o of state.billOccurrences.filter(x=>x.status!=='paid')){const item=state.billDefinitions.find(b=>b.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('bill-'+o.id+'-'+stage,'Bill reminder',(o.name||'Bill')+' needs attention',stage==='overdue'?'Overdue · '+dateFmt(o.dueDate)+'.':stage==='due'?'Due today · '+dateFmt(o.dueDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.dueDate)+'.',now,stage);}if(n.subscription!==false)for(const o of state.subscriptionCycles.filter(x=>x.status!=='paid'&&!x.isTrial)){const item=state.subscriptionDefinitions.find(s=>s.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('sub-'+o.id+'-'+stage,'Subscription reminder',(o.name||'Subscription')+' is renewing',stage==='overdue'?'Overdue · '+dateFmt(o.billingDate)+'.':stage==='due'?'Due today · '+dateFmt(o.billingDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.billingDate)+'     function pinModal(mode){const enabled=state.settings.security.enabled;if(mode==='disable'&&!enabled)return;const title=mode==='enable'?'Enable PIN':mode==='change'?'Change PIN':mode==='recovery'?'Generate recovery key':'Disable PIN',currentLabel=mode==='disable'?'Current PIN or recovery key*':'Current PIN*';openModal(title,'The raw PIN is never stored.',`${mode!=='enable'?formField('current',currentLabel,'','password','required inputmode="numeric" maxlength="64" autocomplete="off"'):''}${mode!=='recovery'&&mode!=='disable'?formField('pin','New PIN*','','password','required inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="new-password"')+formField('confirm','Confirm PIN*','','password','required inputmode="numeric" maxlength="8" autocomplete="new-password"'):''}`,async f=>{if(mode!=='enable'&&!(await verifyPin(f.current)))throw Error('That PIN or recovery key is not correct.');if(mode==='disable'){state.settings.security={enabled:false,hash:'',salt:'',recoveryHash:'',attempts:0};}else if(mode==='recovery'){return pinModalWithRecoveryDownload();}else{const pin=f.pin;if(!/^\d{4,8}$/.test(pin))throw Error('Use 4–8 digits.');const salt=randomSalt();state.settings.security={enabled:true,salt,hash:await hashSecret(pin,salt),recoveryHash:'',attempts:0};}await Storage.save(state);sessionStorage.setItem('sbp-unlocked','yes');closeModal();render();toast(mode==='disable'?'PIN disabled':'PIN settings updated');});}

    function settingsNotificationsView(){const n=state.settings.notifications||{},defaults={'5d':true,'3d':true,'1d':true,due:true,overdue:true},bs=Object.assign({},defaults,n.billStages||{}),ss=Object.assign({},defaults,n.subscriptionStages||{}),stages=(type,v)=>[['5d','5d before'],['3d','3d before'],['1d','1d before'],['due','Due today'],['overdue','Overdue']].map(([k,l])=>`<label class="stage-check"><input type="checkbox" onchange="toggleReminderStage('${type}','${k}',this.checked)" ${v[k]?'checked':''}>${l}</label>`).join('');return `<section class="card pad notification-settings"><div class="cardhead"><div><h2>Notifications</h2><p>Choose exactly when bill and subscription reminders should appear.</p></div></div><div class="setting-row"><div><h3>All reminders</h3><p>When off, reminders stay hidden from the drawer and badge.</p></div><input class="toggle" type="checkbox" data-notification="master" ${n.master?'checked':''}></div><div class="notification-rule"><div class="notification-rule-head"><div><h3>Bill reminders</h3><p>Turn bill reminders on/off and control each stage independently.</p></div><input class="toggle" type="checkbox" data-notification="bill" ${n.bill!==false?'checked':''}></div><div class="stage-grid">${stages('bill',bs)}</div></div><div class="notification-rule"><div class="notification-rule-head"><div><h3>Subscription reminders</h3><p>Turn subscription reminders on/off and control each stage independently.</p></div><input class="toggle" type="checkbox" data-notification="subscription" ${n.subscription!==false?'checked':''}></div><div class="stage-grid">${stages('subscription',ss)}</div></div><div class="setting-row"><div><h3>Trial ending reminders</h3><p>Show reminders for trials approaching their end date.</p></div><input class="toggle" type="checkbox" data-notification="trial" ${n.trial?'checked':''}></div><div class="setting-row"><div><h3>Education cost reminders</h3><p>Show reminders for unpaid education costs approaching their due date.</p     function settingsPrivacyView(){return `<section class="card pad"><div class="cardhead"><div><h2>Privacy & Data</h2><p>Financial records stay locally in this browser. Backups and exports are local downloads.</p></div><span class="pill sage">${icon('shield')} No network core</span></div><div class="privacy-row"><div class="privacy-copy"><h3>Create backup</h3><p>Download a complete JSON copy of your planner data and settings.</p></div><button class="btn" data-action="backup">${icon('download')} Create backup</button></div><div class="privacy-row"><div class="privacy-copy"><h3>Restore backup</h3><p>Validate the file before replacing current data.</p></div><button class="btn" data-action="restore">${icon('upload')} Restore backup</button></div><div class="privacy-row"><div class="privacy-copy"><h3>CSV export</h3><p>Download a spreadsheet-friendly transaction history.</p></div><button class="btn" data-action="export-transactions">${icon('download')} Export CSV</button></div><div class="privacy-row"><div class="privacy-copy"><h3>Clear financial data</h3><p>Remove financial records while preserving preferences and categories.</p></div><button class="btn danger" data-action="clear-financial">Clear financial data</button></div><div class="privacy-row"><div class="privacy-copy"><h3>Delete all app data</h3><p>Factory reset, including preferences and PIN protection.</p></div><button class="btn danger" data-action="clear-all">Factory reset</button></div></section>`;}

    function settingsSecurityView(){const enabled=state.settings.security.enabled;return `<section class="card pad"><div class="cardhead"><div><h2>Security</h2><p>Protect this local workspace with a PIN. The raw PIN is never stored.</p></div><span class="pill ${enabled?'sage':'gold'}">${enabled?'PIN enabled':'PIN off'}</span></div><div class="setting-row"><div><h3>Protect this workspace</h3><p>Use 4–8 digits. To disable protection, enter either your current PIN or saved recovery key.</p></div><button class="btn ${enabled?'danger':'primary'}" data-action="${enabled?'disable-pin':'enable-pin'}">${icon('lock')} ${enabled?'Disable PIN':'Enable PIN'}</button></div>${enabled?`<div class="setting-row"><div><h3>Manage PIN</h3><p>Change your PIN using the current PIN, a new PIN and confirmation.</p></div><button class="btn" data-action="change-pin">Manage PIN</button></div><div class="setting-row"><div><h3>Recovery key</h3><p>Generate a new key for the Forgot your PIN? flow.</p></div><button class="btn" data-action="recovery-key">Generate recovery key</button></div>`:''}</section>`;}
    function settingsSecurityViewV2(){const enabled=state.settings.security.enabled;return `<section class="card pad"><div class="cardhead"><div><h2>Security</h2><p>Protect this local workspace with a PIN. The raw PIN is never stored.</p></div><span class="pill ${enabled?'sage':'gold'}">${enabled?'PIN enabled':'PIN off'}</span></div><div class="setting-row"><div><h3>Protect this workspace</h3><p>Use 4–8 digits. To disable protection, enter either your current PIN or saved recovery key.</p></div><button class="btn ${enabled?'danger':'primary'}" data-action="${enabled?'disable-pin':'enable-pin'}">${icon('lock')} ${enabled?'Disable PIN':'Enable PIN'}</button></div>${enabled?`<div class="setting-row"><div><h3>Manage PIN</h3><p>Change your PIN with your current PIN, a new PIN and confirmation.</p></div><button class="btn" data-action="change-pin">Manage PIN</button></div><div class="setting-row"><div><h3>Recovery key</h3><p>Generate a new key for the Forgot your PIN? flow.</p></div><button class="btn" data-action="recovery-key">Generate recovery key</button></div>`:''}</section>`;}
    function settingsHelpView(){const groups=[['Getting started',[['Start here',['Set your name, currency and preferred formats in General.','Create a monthly budget, then add categories and planned amounts.','Record income and expenses when money actually moves.']],['Dashboard',['Read received, spent, saved and remaining first.','Use Add quick for fast entries.','Use the bell for local reminders.']],['Income & Expenses',['Income is money received; expenses are money spent.','Transactions are the source for monthly totals and reports.']]]],['Using the planner',[['Bills & Subscriptions',['Add a recurring item once and review its next opening date.','Pay only when it is actually paid.','Pause, end or delete from More options.']],['Notifications & reminders',['Master switch controls visibility of local reminders.','Bill and subscription stages are independent: 5d, 3d, 1d, today and overdue.']],['Privacy, backup & PIN',['Create a backup before clearing data.','Forgot your PIN? accepts the saved recovery key.','Reset locked app clears local data only after confirmation.']],['Appearance & accessibility',['Theme, text size and reduced motion are saved locally.','General formats change display only; stored amounts are not converted.']]]]];return `<section class="card pad"><div class="cardhead"><div><h2>Help & About</h2><p>Beginner-friendly guidance first, with deeper explanations when you need them.</p></div></div><div class="help-section-grid">${groups.map(([title,items])=>`<section class="help-section"><h3>${title}</h3>${items.map(([name,lines])=>`<details><summary>${name}</summary><div class="help-topic-body">${lines.map(x=>`<p>${x}</p>`).join('')}</div></details>`).join('')}</section>`).join('')}</div><div style="margin-top:19px;padding-top:19px;border-top:1px solid var(--line)"><p class="hint">${APP_NAME}<br>Private local browser software. Notifications operate while the app is open.</p></div></section>`;}

    // Keep the settings renderer in the same closure as the app state.  Defining
    // this after the IIFE made the settings click throw before the page could
    // render because `settingsSection` is private to this closure.
    function settingsSectionMarkup(){
      return settingsSection==='general'?settingsGeneralView():
        settingsSection==='appearance'?settingsAppearanceView():
        settingsSection==='categories'?settingsCategoriesView():
        settingsSection==='semester-preferences'?semesterSettings():
        settingsSection==='budget-preferences'?budgetSettings():
        settingsSection==='notifications'?settingsNotificationsView():
        settingsSection==='privacy'?settingsPrivacyView():
        settingsSection==='security'?settingsSecurityViewV2():
        settingsSection==='help'?settingsHelpView():
        generalSettings();
    }
    Object.assign(window,{filterCurrencySuggestions,selectCurrencySuggestion,chooseCurrencyWithKeyboard,saveGeneralSettings,saveAppearanceSettings,applyCustomReportDates,toggleReminderStage,resetLockedApp});
  })();
    function settingsSectionMarkup(){return settingsSection==='general'?generalSettings():settingsSection==='appearance'?appearanceSettings():settingsSection==='categories'?categorySettings():settingsSection==='semester-preferences'?semesterSettings():settingsSection==='budget-preferences'?budgetSettings():settingsSection==='notifications'?notificationSettings():settingsSection==='privacy'?privacySettings():settingsSection==='security'?securitySettings():helpSettings();}
    function securitySettings(){const enabled=state.settings.security.enabled;return `<section class="card pad"><div class="cardhead"><div><h2>Security</h2><p>Protect this local workspace with a PIN. Your raw PIN is never stored.</p></div><span class="pill ${enabled?'sage':'gold'}">${enabled?'PIN enabled':'PIN off'}</span></div><div class="setting-row"><div><h3>Protect this workspace</h3><p>Use 4–8 digits. To disable protection, enter either your current PIN or saved recovery key.</p></div><button class="btn ${enabled?'danger':'primary'}" data-action="${enabled?'disable-pin':'enable-pin'}">${icon('lock')} ${enabled?'Disable PIN':'Enable PIN'}</button></div>${enabled?`<div class="setting-row"><div><h3>Lock now</h3><p>Lock the workspace immediately from this device.</p></div><button class="btn" data-action="lock-now">${icon('lock')} Lock workspace</button></div><div class="setting-row"><div><h3>Recovery key</h3><p>Create a new recovery key if you need a safe backup way into the workspace.</p></div><button class="btn" data-action="recovery-key">Generate recovery key</button></div>`:''}</section>`;}
    function helpSettings(){const beginner=[['Start here',['Set your name, currency and preferred formats in General.','Create a monthly budget, then add categories and planned amounts.','Record income and expenses only when money actually moves.']],['Dashboard',['Read received, spent, saved and remaining first.','Use Add quick for a fast income, expense, bill or saving entry.','Coming up and Savings wins show the next useful action.']],['Budget',['Planned is your intention; Actual is what you recorded.','Essentials and Flexible help you decide what can move when money is tight.','Use Remaining and Status to see which category needs attention.']],['Income & Expenses',['Income records money received; expenses record money spent.','Transactions are the unified history behind monthly totals and reports.','Use search, Type filter and Show full history to find older records.']],['Bills & Subscriptions',['Create a recurring item once and review its next opening date.','Pay only when the bill or subscription is actually paid.','More options lets you edit, pause, end or delete while keeping paid history.']],['Savings & Goals',['Goals are targets; sinking funds are planned future costs.','Contribute when money is actually set aside.','Progress uses recorded contributions, not estimates.']]],advanced=[['Semester & Education Costs',['Create a term, add education costs and record payments separately.','Funding keeps scholarships, support, earned money and borrowed money distinct.','The semester summary compares planned cost, paid amount and remaining amount.']],['Reports & Insights',['Choose a preset period or Custom dates.','Summary, trend, category and budget cards use the same selected date window.','Semester education reporting remains term-wide so it is not confused with monthly spending.']],['Notifications & reminders',['Use the master switch to show or hide local reminders.','Bill and subscription stages can be enabled independently for 5d, 3d, 1d, today and overdue.','Notifications work while the app is open and remain inside this browser.']],['Privacy, backup & restore',['Create a backup before clearing or resetting data.','Restore validates that the file belongs to Student Budget Planner.','CSV export is useful for a spreadsheet copy of transaction history.']],['PIN security',['Lock now protects the current session; closing and reopening requires the PIN.','Forgot your PIN? accepts the saved recovery key.','Reset locked app clears local data only after confirmation; a backup can be restored afterward.']],['Appearance & accessibility',['Theme changes the visual mode; text size changes the workspace scale.','Reduced motion removes decorative transitions and celebrations.','General formats affect how dates and amounts are displayed, not stored values.']]];const group=(title,items)=>`<section class="help-section"><h3>${title}</h3>${items.map(([name,lines])=>`<details><summary>${name}</summary><div class="help-topic-body">${lines.map(x=>`<p>${x}</p>`).join('')}</div></details>`).join('')}</section>`;return `<section class="card pad"><div class="cardhead"><div><h2>Help & About</h2><p>Beginner-friendly guidance first, with deeper explanations when you need them.</p></div></div><div class="help-section-grid">${group('Getting started',beginner)}${group('Using the planner',advanced)}</div><div style="margin-top:19px;padding-top:19px;border-top:1px solid var(--line)"><p class="hint">${APP_NAME}<br>Private local browser software. Notifications operate while the app is open.</p></div></section>`;}
    function defaultReminderStages(){return {'5d':true,'3d':true,'1d':true,'due':true,'overdue':true};}
    function notificationAllowed(type,stage){const n=state.settings.notifications||{},map={'Bill reminder':'bill','Subscription reminder':'subscription','Trial ending':'trial','Education cost due':'education'};if(!n.master)return false;const key=map[type];if(key&&n[key]===false)return false;if(stage&&key==='bill'&&n.billStages?.[stage]===false)return false;if(stage&&key==='subscription'&&n.subscriptionStages?.[stage]===false)return false;return true;}
    function syncNotifications(){const n=state.settings.notifications||{},now=today();state.notifications=state.notifications.filter(item=>notificationAllowed(item.type,item.stage)&&(!item.dismissed||Date.now()-new Date(item.createdAt).getTime()<90*86400000));const existing=new Set(state.notifications.map(item=>item.key));const add=(key,type,title,body,date=now,stage='')=>{if(!notificationAllowed(type,stage)||existing.has(key))return;state.notifications.push({id:uid('notice'),key,type,stage,title,body,date,createdAt:new Date().toISOString(),read:false,dismissed:false});existing.add(key);};if(!n.master)return;for(const a of allocations(selectedMonth)){const actual=actualCategory(selectedMonth,a.categoryId),pct=a.plannedCents?actual/a.plannedCents*100:0;for(const th of state.settings.budgetThresholds){if(pct>=th)add('budget-'+selectedMonth+'-'+a.categoryId+'-'+th,'Budget threshold',category(a.categoryId).name+' is at '+th+'%',money(actual)+' spent of '+money(a.plannedCents)+' planned in '+monthFmt(selectedMonth)+'.');}}if(n.bill!==false)for(const o of state.billOccurrences.filter(x=>x.status!=='paid')){const item=state.billDefinitions.find(b=>b.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('bill-'+o.id+'-'+stage,'Bill reminder',(o.name||'Bill')+' needs attention',stage==='overdue'?'Overdue · '+dateFmt(o.dueDate)+'.':stage==='due'?'Due today · '+dateFmt(o.dueDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.dueDate)+'.',now,stage);};if(n.subscription!==false)for(const o of state.subscriptionCycles.filter(x=>x.status!=='paid'&&!x.isTrial)){const item=state.subscriptionDefinitions.find(s=>s.id===o.definitionId),stage=commitmentReminderStage(item,o,now);if(stage)add('sub-'+o.id+'-'+stage,'Subscription reminder',(o.name||'Subscription')+' is renewing',stage==='overdue'?'Overdue · '+dateFmt(o.billingDate)+'.':stage==='due'?'Due today · '+dateFmt(o.billingDate)+'.':stage.replace('d',' days before')+' · due '+dateFmt(o.billingDate)+'.',now,stage);}if(n.trial!==false)for(const o of state.subscriptionCycles.filter(x=>x.isTrial&&x.status!=='paid'&&x.billingDate<=addDays(now,5)))add('trial-'+o.id,'Trial ending',(o.name||'Trial')+' is ending',dateFmt(o.billingDate)+' · first paid billing follows.');if(n.education!==false)for(const c of state.educationCostItems.filter(x=>x.dueDate&&x.dueDate<=addDays(now,7)&&itemPaid(x)<x.plannedCents))add('edu-'+c.id,'Education cost due',c.name+' is coming up',dateFmt(c.dueDate)+' · '+money(c.plannedCents-itemPaid(c)));for(const g of [...state.savingsGoals,...state.sinkingFunds]){const pct=g.targetCents?goalSaved(g)/g.targetCents*100:0;for(const th of [25,50,75,100])if(pct>=th)add('goal-'+g.id+'-'+th,'Goal milestone',g.name+' reached '+th+'%',money(goalSaved(g))+' saved toward '+money(g.targetCents)+'.');}}
    async function toggleReminderStage(type,stage,checked){const n=state.settings.notifications||{};n[type+'Stages']=Object.assign(defaultReminderStages(),n[type+'Stages']||{}, {[stage]:checked});state.settings.notifications=n;syncNotifications();await persist();render();}
    function lockScreen(){return `<main class="lock-screen"><section class="card lock-card"><div class="lock-brandmark">${icon('lock')}</div><div class="eyebrow">${APP_NAME.toUpperCase()}</div><h1>Your private workspace</h1><p>Enter your PIN to pick up where you left off.</p><form data-form="unlock"><div class="form-error" role="alert"></div>${formField('pin','PIN','','password','required inputmode="numeric" maxlength="8" autocomplete="off"')}<div class="form-actions"><button class="btn primary" type="submit">${icon('lock')} Unlock workspace</button></div></form><button class="linkbtn lock-help" data-action="use-recovery">Forgot your PIN?</button></section></main>`;}
    function recoveryScreen(){return `<main class="lock-screen"><section class="card lock-card"><div class="lock-brandmark">${icon('lock')}</div><div class="eyebrow">PRIVATE WORKSPACE</div><h1>${APP_NAME}</h1><p>Your local financial workspace is protected.</p><p>Enter your saved recovery key to unlock the workspace.</p><form data-form="recovery"><div class="form-error" role="alert"></div>${formField('key','Recovery key','','text','required autocomplete="off"')}<div class="form-actions"><button class="btn primary" type="submit">Unlock workspace</button></div></form><button class="linkbtn lock-help" data-action="use-pin">Use PIN instead</button><div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--line);text-align:center"><p class="hint">Last resort: resetting deletes all local data. A saved backup can be restored afterward.</p><button type="button" class="btn danger" onclick="resetLockedApp()">Reset locked app</button></div></section></main>`;}
    function resetLockedApp(){if(!confirm('Reset locked app? This deletes all local financial data, settings and PIN protection.'))return;state=defaults();Storage.save(state).then(()=>{sessionStorage.removeItem('sbp-unlocked');pinLock=false;render();toast('Local workspace reset');});}
    function topbar(){const name=state.settings.name?.trim(),activeTheme=state.settings.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.settings.theme,nextTheme=activeTheme==='dark'?'light':'dark',themeLabel=nextTheme==='dark'?'Switch to dark theme':'Switch to light theme';return `<header class="topbar"><div class="top-left"><div class="mobile-brand" aria-label="Student Budget Planner"><div class="brandmark">${icon('receipt')}</div><div class="brandname"><span>Student Budget</span><span>Planner</span></div></div><span class="top-pulse" aria-hidden="true">${icon('chart')}</span><div class="crumb"><span>${name?`Good morning, ${esc(name)}`:'Student Money Hub'}</span><strong>· ${pageTitle()}</strong></div></div><div class="topactions">${state.settings.security.enabled?`<button class="iconbtn top-lock" data-action="lock-now" aria-label="Lock workspace" title="Lock workspace">${icon('lock')}</button>`:''}<button class="iconbtn theme-toggle" data-action="toggle-theme" aria-label="${themeLabel}" title="${themeLabel}">${icon(nextTheme==='dark'?'moon':'sun')}</button><button class="iconbtn" data-action="notifications" aria-label="Notifications">${icon('bell')}${unreadCount()?`<span class="badge">${unreadCount()>9?'9+':unreadCount()}</span>`:''}</button><button class="btn primary" data-action="quick-menu" aria-haspopup="dialog">${icon('plus')}<span class="quick-label">Add quick</span></button></div></header>`;}
